<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!--
      明暗偏好在 React 启动前就要落到 <html>：否则深色读者每次刷新都会先看到
      一帧白底，再被主题层改成深色。Cookie 是同步可读的，所以放在这里。
      脚本必须是同源外部文件：CSP 的 script-src 'self' 会拒绝内联脚本。
    -->
    <script src="/theme-boot.js"></script>
    <style>
      html[data-mode='dark'],
      html[data-mode='dark'] body {
        background: #0b0d11;
      }
    </style>
    <meta
      name="description"
      content="Practacu Press — 支持多站点、审核流程与社区互动的独立出版 CMS。"
      data-pp-seo="1"
    />
    <!--
      以下分享标签是「不执行 JS 的抓取器」看到的默认值。
      data-pp-seo 让运行时（lib/seo.ts）在首屏把它们整体替换成当前页面的真实值，
      不会留下两份 og:title。
    -->
    <meta property="og:site_name" content="Practacu Press" data-pp-seo="1" />
    <meta property="og:type" content="website" data-pp-seo="1" />
    <meta property="og:title" content="Practacu Press" data-pp-seo="1" />
    <meta
      property="og:description"
      content="支持多站点、审核流程与社区互动的独立出版 CMS。"
      data-pp-seo="1"
    />
    <meta property="og:locale" content="zh_CN" data-pp-seo="1" />
    <meta name="twitter:card" content="summary" data-pp-seo="1" />
    <title>Practacu Press</title>
    <!-- Feed autodiscovery for crawlers that do not execute JavaScript. The runtime
         SEO layer replaces these with the configured canonical URLs when feeds are
         enabled, and removes them when the owner switches feeds off. -->
    <link rel="alternate" type="application/rss+xml" title="Practacu Press RSS" href="/rss.xml" data-pp-seo="1" />
    <link rel="alternate" type="application/atom+xml" title="Practacu Press Atom" href="/atom.xml" data-pp-seo="1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2313130f'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23ffffff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

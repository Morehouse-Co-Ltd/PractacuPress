# Practacu Press —— Docker 自托管部署（单站点）
# Practacu Press — single-site Docker deployment
#
# 开发 / Development:
#   docker compose up -d --build
#
# 生产 / Production:
#   cp deploy/production/env.prod.example .env.prod
#   docker compose --env-file .env.prod up -d --build
#
# 使用已发布镜像 / Prebuilt image:
#   PP_IMAGE=ghcr.io/<owner>/practacu-press:v1.2.3 docker compose pull
#   PP_IMAGE=ghcr.io/<owner>/practacu-press:v1.2.3 docker compose up -d
#
# 默认只绑定 127.0.0.1；生产在前面加 TLS 反代，不要把未安装完的实例暴露到公网。
# Bound to 127.0.0.1 by default; put a TLS proxy in front for public deployments.
# 详细步骤 / Full guide: docs/deployment/production-profile.md

name: practacu-press

services:
  # 单容器：Practacu Press + 内嵌 SPA + 进程内安全检查。
  # One container: Practacu Press, embedded SPA and in-process security checks.
  practacu-press:
    container_name: practacu-press
    image: ${PP_IMAGE:-practacu-press:development}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${PP_VERSION:-development}
    restart: unless-stopped
    networks: [internal]
    ports:
      - "127.0.0.1:${PP_HTTP_PORT:-8080}:8080"
    env_file:
      # .env 用于本地；.env.prod 用于生产，后者覆盖前者。两个都可以不存在。
      # .env for local, .env.prod for production; the latter wins. Both optional.
      - path: .env
        required: false
      - path: .env.prod
        required: false
    environment:
      # 开发默认值；生产用 APP_ENV=production、PP_DESKTOP=false。
      # Development defaults; production sets APP_ENV=production and PP_DESKTOP=false.
      APP_ENV: ${APP_ENV:-development}
      PP_DESKTOP: ${PP_DESKTOP:-true}
      # Only relax the first-admin loopback check during the loopback install phase.
      PP_FIRST_ADMIN_TRUST_PROXY: ${PP_FIRST_ADMIN_TRUST_PROXY:-1}
      # TLS is terminated by the host proxy; production sets COOKIE_SECURE=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      BACKUP_ENCRYPTION: ${BACKUP_ENCRYPTION:-}
      # Container-internal HTTP. / 容器内 HTTP 监听。
      HTTP_ADDR: 0.0.0.0:8080
      PP_ALLOW_REMOTE_API: "1"
      DATABASE_DRIVER: sqlite
      DATABASE_DSN: file:/data/practacu.db
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/media
      BACKUP_DIR: /data/backups
      MEDIA_DEFAULT_USER_QUOTA_BYTES: ${MEDIA_DEFAULT_USER_QUOTA_BYTES:-536870912}
      MEDIA_DEFAULT_SITE_QUOTA_BYTES: ${MEDIA_DEFAULT_SITE_QUOTA_BYTES:-10737418240}
      # Trust the compose subnet so rate limits and logs see real client IPs.
      TRUSTED_PROXIES: ${PP_DOCKER_SUBNET:-172.28.0.0/16}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      AUTH_CREDENTIAL_RATE_LIMIT_PER_MINUTE: ${AUTH_CREDENTIAL_RATE_LIMIT_PER_MINUTE:-10}
      HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS:-300}
    volumes:
      - practacu-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 25s
    # Go's graceful shutdown is 10s; leave headroom for in-flight writes.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${PP_DOCKER_SUBNET:-172.28.0.0/16}

volumes:
  # Named volume keeps SQLite writable without host ownership surprises.
  # 命名卷避免 SQLite 遇到宿主机目录属主问题。
  practacu-data:

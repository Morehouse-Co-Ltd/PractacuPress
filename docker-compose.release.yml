# Practacu Press —— 使用发布镜像运行（叠加在 docker-compose.yml 之上）
#
#   PP_IMAGE_PREFIX=ghcr.io/<owner> PP_VERSION=v1.0.0 \
#     docker compose -f docker-compose.yml -f docker-compose.release.yml pull
#   PP_IMAGE_PREFIX=ghcr.io/<owner> PP_VERSION=v1.0.0 \
#     docker compose -f docker-compose.yml -f docker-compose.release.yml up -d
#
# Docker Hub 的镜像前缀就是 Docker Hub 用户名：
#   PP_IMAGE_PREFIX=<dockerhub-user>
#
# PP_VERSION 省略时使用 latest（只有正式版发布会更新 latest；beta 用
# vX.Y.Z-betaN 或 beta 标签）。
#
# 数据卷、网络、环境变量和健康检查全部继承 docker-compose.yml；这里只把
# build 换成已发布的镜像，避免生产机在本地编译。

services:
  api:
    image: ${PP_IMAGE_PREFIX:?set PP_IMAGE_PREFIX to ghcr.io/<owner> or a Docker Hub user}/practacu-press-api:${PP_VERSION:-latest}
    pull_policy: always

  security:
    image: ${PP_IMAGE_PREFIX:?set PP_IMAGE_PREFIX to ghcr.io/<owner> or a Docker Hub user}/practacu-press-security:${PP_VERSION:-latest}
    pull_policy: always

  # 可选静态站镜像；默认 API 镜像已内嵌前端，不需要启动这个服务。
  # 只有显式 `docker compose --profile static ...` 时才会用到。
  web:
    image: ${PP_IMAGE_PREFIX:?set PP_IMAGE_PREFIX to ghcr.io/<owner> or a Docker Hub user}/practacu-press-web:${PP_VERSION:-latest}
    pull_policy: always

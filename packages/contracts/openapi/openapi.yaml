openapi: 3.1.0
info:
  title: Practacu Press API
  version: 0.1.0
  description: |
    Multi-site community CMS API.

    Contract rules:
    - Every resource is scoped to the site resolved from the request host.
    - Access tokens are Ed25519 signed JWTs carried as `Authorization: Bearer`.
    - The refresh token lives only in an HttpOnly cookie scoped to `/api/v1/auth`;
      refresh calls additionally require the `X-CSRF-Token` header to match the
      `pp_csrf` cookie.
    - Every error is `application/problem+json` with a stable `code`.
servers:
  - url: /api/v1
    description: Versioned API root. Health endpoints sit outside this prefix.
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: platform
  - name: sites
  - name: content
  - name: community
  - name: media
  - name: events
  - name: messaging
  - name: notifications
  - name: analytics
  - name: taxonomy
  - name: backups
  - name: extensions
  - name: feeds

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: Reports process liveness only. Never depends on the database or upstream services.
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: Checks dependencies, currently the database connection.
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: unready }

  /openapi.json:
    get:
      tags: [system]
      summary: OpenAPI document
      description: Served without a session so tooling can fetch it.
      security: []
      responses:
        '200':
          description: The contract document
          content:
            application/json:
              schema:
                type: object

  /rss.xml:
    get:
      tags: [feeds]
      summary: Site RSS 2.0 feed
      description: |
        The published content of the host-resolved site as RSS 2.0. The request Host
        selects the site, so the same path serves a different feed on every configured
        hostname. Only published items are listed.

        The feed is omitted with `404` when the site owner switched feeds off, when
        indexing is disabled, or when the site is members-only. `?category=<slug>` and
        `?tag=<slug>` narrow the feed to one taxonomy term; sending both is a `400`.
      security: []
      servers:
        - url: /
      parameters:
        - name: category
          in: query
          required: false
          description: Category slug to narrow the feed.
          schema: { type: string }
        - name: tag
          in: query
          required: false
          description: Tag slug (or a free-form tag name) to narrow the feed.
          schema: { type: string }
      responses:
        '200':
          description: RSS 2.0 document
          content:
            application/rss+xml:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'

  /atom.xml:
    get:
      tags: [feeds]
      summary: Site Atom 1.0 feed
      description: |
        The Atom 1.0 equivalent of `/rss.xml`, with the same host resolution,
        visibility rules, query narrowing and `404` conditions.
      security: []
      servers:
        - url: /
      parameters:
        - name: category
          in: query
          required: false
          description: Category slug to narrow the feed.
          schema: { type: string }
        - name: tag
          in: query
          required: false
          description: Tag slug (or a free-form tag name) to narrow the feed.
          schema: { type: string }
      responses:
        '200':
          description: Atom 1.0 document
          content:
            application/atom+xml:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'

  /feed.xml:
    get:
      tags: [feeds]
      summary: Site RSS 2.0 feed alias
      description: |
        Alias of `/rss.xml` kept for readers configured before `/rss.xml` became the
        canonical address. It answers with the same body and media type.
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: RSS 2.0 document
          content:
            application/rss+xml:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /category/{slug}/rss.xml:
    get:
      tags: [feeds]
      summary: Category RSS 2.0 feed
      description: |
        Published articles and posts in one category. The slug is resolved inside the
        host-resolved site; an unknown category answers `404`. The feed is also `404`
        when site feeds or taxonomy feeds are switched off.
      security: []
      servers:
        - url: /
      parameters:
        - $ref: '#/components/parameters/FeedSlug'
      responses:
        '200':
          description: RSS 2.0 document
          content:
            application/rss+xml:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /category/{slug}/atom.xml:
    get:
      tags: [feeds]
      summary: Category Atom 1.0 feed
      description: Atom 1.0 equivalent of `/category/{slug}/rss.xml`.
      security: []
      servers:
        - url: /
      parameters:
        - $ref: '#/components/parameters/FeedSlug'
      responses:
        '200':
          description: Atom 1.0 document
          content:
            application/atom+xml:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /tag/{slug}/rss.xml:
    get:
      tags: [feeds]
      summary: Tag RSS 2.0 feed
      description: |
        Published articles and posts carrying one tag. A taxonomy tag is resolved by
        slug; a free-form tag that never made it into the taxonomy table is matched by
        the slug text itself, so every tag rendered by the site has a feed.
      security: []
      servers:
        - url: /
      parameters:
        - $ref: '#/components/parameters/FeedSlug'
      responses:
        '200':
          description: RSS 2.0 document
          content:
            application/rss+xml:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /tag/{slug}/atom.xml:
    get:
      tags: [feeds]
      summary: Tag Atom 1.0 feed
      description: Atom 1.0 equivalent of `/tag/{slug}/rss.xml`.
      security: []
      servers:
        - url: /
      parameters:
        - $ref: '#/components/parameters/FeedSlug'
      responses:
        '200':
          description: Atom 1.0 document
          content:
            application/atom+xml:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /setup/status:
    get:
      tags: [system]
      summary: Install status for the requesting host
      description: |
        Reports whether the hostname still belongs to an installed site, so a browser
        holding a saved install configuration can tell that the data directory was
        deleted and reopen the setup wizard instead of rendering an empty site.

        Served without a session and without site resolution: answering when no site
        exists is the whole point. `has_admin` is advisory and must not be used to
        reset a configuration on its own — a server deployment whose first account is
        a plain member would otherwise loop through the wizard.
      security: []
      responses:
        '200':
          description: Install status for the request hostname
          content:
            application/json:
              schema:
                type: object
                required: [installed, has_admin]
                properties:
                  installed:
                    type: boolean
                    description: True when the hostname resolves to a site.
                  has_admin:
                    type: boolean
                    description: True when the site has an active administrator.
                  reason:
                    type: string
                    enum: [no_site, domain_unverified, not_configured]
                    description: Present when `installed` is false.
                  site_id:
                    type: string
                    description: Present when `installed` is true.
                  site_name:
                    type: string
                    description: Present when `installed` is true.
                  registration_open:
                    type: boolean
                    description: |
                      Present when `installed` is true. Lets a visitor-facing client hide
                      the register entry point when the site has closed sign-ups.
        '503':
          description: The site service is not mounted in this process
          content:
            application/json:
              schema:
                type: object
                required: [installed, reason]
                properties:
                  installed: { type: boolean }
                  reason: { type: string }
        '500':
          description: The install status could not be read
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /captcha/status:
    get:
      tags: [auth]
      summary: Human verification status
      description: |
        Reports the human verification (CAPTCHA) rule this deployment really enforces
        for the resolved site. Public on purpose: the login, registration, password
        reset and comment forms have to know whether to draw a widget before a session
        exists, and this endpoint is also what the admin settings page shows.

        `effective` is the only field a form may act on. A site can enable a provider
        while the server holds no secret for it; the rule is then reported as
        `enabled: true` with `effective: false`, every scene `false`, and a warning is
        written to the server log instead of pretending the check runs.

        The response carries no secret. `site_key` is the public widget key (it is
        embedded in the page anyway) and `server_configured` is a single boolean that
        tells the settings page whether the deployment side is finished.
      security: []
      responses:
        '200':
          description: Effective rule for the resolved site
          content:
            application/json:
              schema:
                type: object
                required: [enabled, provider, site_key, scenes, server_configured, effective, checked_at]
                properties:
                  enabled:
                    type: boolean
                    description: The site's stored switch, regardless of whether it can be enforced.
                  provider:
                    type: string
                    enum: [turnstile, hcaptcha, local]
                    description: |
                      The selected service. `local` is the built-in arithmetic
                      challenge served by this API process; it needs no site key and
                      no server secret.
                  site_key:
                    type: string
                    description: Public widget key; empty when the site never saved one or selected `local`.
                  scenes:
                    type: object
                    description: Scenes that are really challenged right now.
                    required: [login, register, password_reset, comment]
                    properties:
                      login: { type: boolean }
                      register: { type: boolean }
                      password_reset: { type: boolean }
                      comment: { type: boolean }
                  server_configured:
                    type: boolean
                    description: Whether this process holds the provider's server secret.
                  effective:
                    type: boolean
                    description: True only when a widget must be rendered and the server checks its token.
                  checked_at:
                    type: string
                    format: date-time
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /captcha/local/challenge:
    get:
      tags: [auth]
      summary: Issue a self-hosted picture challenge
      description: |
        Issues a short-lived picture challenge for the built-in `local` provider.
        Public on purpose: the login, registration, password reset and comment forms
        call it before rendering their widget, exactly like they call
        `/captcha/status` first.

        Three interactions rotate at random, named by `kind`:

        - `slider`: drag a circular piece into the socket cut out of `background`;
          the challenge carries `piece`, `piece_size`, `piece_top` and `max_offset`;
        - `click`: click every star in `image` (`target_count` of them);
        - `select`: pick the `target_count` cells of the `rows` x `cols` grid in
          `image` that contain a circle.

        The expected answer never leaves the server: the browser posts its geometry
        back to `/captcha/local/verify`, which returns the token the protected
        endpoint expects. A deployment that does not wire the local challenge store
        answers 503, and `/captcha/status` never reports the provider as effective
        there.

        The local provider is stateful per process: the challenge and the verify call
        (and later the protected request) must reach the same API instance.
      security: []
      parameters:
        - name: scene
          in: query
          required: true
          description: The protected form the challenge is for.
          schema: { type: string, enum: [login, register, password_reset, comment] }
      responses:
        '200':
          description: One issued challenge
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, kind, prompt, expires_at, width, height]
                properties:
                  challenge_id:
                    type: string
                    description: Opaque id to submit with the answer; single use.
                  kind:
                    type: string
                    enum: [slider, click, select]
                    description: Which interaction the browser must render.
                  prompt:
                    type: string
                    description: Human readable instruction for non-browser clients.
                  expires_at:
                    type: string
                    format: date-time
                  width:
                    type: integer
                    description: Picture width in its own pixel space.
                  height:
                    type: integer
                    description: Picture height in its own pixel space.
                  image:
                    type: string
                    description: PNG data URL for the `click` and `select` kinds.
                  background:
                    type: string
                    description: PNG data URL of the scene for the `slider` kind.
                  piece:
                    type: string
                    description: PNG data URL of the movable piece for the `slider` kind.
                  piece_size:
                    type: integer
                    description: Piece edge length in picture pixels (`slider`).
                  piece_top:
                    type: integer
                    description: Vertical position of the piece in picture pixels (`slider`).
                  max_offset:
                    type: integer
                    description: Largest legal piece X offset in picture pixels (`slider`).
                  target_count:
                    type: integer
                    description: Number of stars or cells to pick (`click`, `select`).
                  rows:
                    type: integer
                    description: Grid rows (`select`).
                  cols:
                    type: integer
                    description: Grid columns (`select`).
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /captcha/local/verify:
    post:
      tags: [auth]
      summary: Solve a self-hosted picture challenge
      description: |
        Checks the answer to a challenge issued by `/captcha/local/challenge` and
        mints a one-shot token bound to the scene. Only the field matching the
        challenge `kind` is read: `x` for a slider, `points` for a click and `tiles`
        for a select challenge. A wrong answer consumes the challenge too (the
        browser asks for another one), so a script cannot probe the answer space on a
        single picture.

        The returned token is submitted as `captcha_token` to the protected endpoint,
        exactly like a Turnstile or hCaptcha token, and is valid for five minutes at
        most.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, answer, scene]
              properties:
                challenge_id: { type: string }
                answer:
                  type: object
                  description: The geometry of the solution; only the matching field is used.
                  properties:
                    x:
                      type: integer
                      description: Left edge of the piece in picture pixels (`slider`).
                    points:
                      type: array
                      description: Clicked points in picture pixels (`click`).
                      items:
                        type: object
                        required: [x, y]
                        properties:
                          x: { type: integer }
                          y: { type: integer }
                    tiles:
                      type: array
                      description: Selected cell indexes, row-major (`select`).
                      items: { type: integer }
                scene: { type: string, enum: [login, register, password_reset, comment] }
      responses:
        '200':
          description: The solved token
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                    description: One-shot token for the protected endpoint.
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /auth/register/email:
    post:
      tags: [auth]
      summary: Register with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  description: |
                    12–128 characters combining at least two of lowercase, uppercase,
                    digits and symbols; classic weak passwords are refused with
                    `details.rule: too_common`. The rule only gates passwords being
                    created or changed, so older stored passwords keep logging in.
                display_name: { type: string, maxLength: 120 }
                captcha_token:
                  type: string
                  maxLength: 4096
                  description: |
                    Solved human verification token, when `GET /captcha/status` reports
                    `scenes.register`. Optional in the schema because a site may not
                    require it; when it is required and absent the response is `400`
                    with `details.reason: captcha_required`.
      responses:
        '201':
          description: Account created and session started
          headers:
            Set-Cookie:
              description: Sets the HttpOnly `pp_refresh` cookie and the readable `pp_csrf` cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /auth/login/password:
    post:
      tags: [auth]
      summary: Log in with email or username and password
      description: |
        The identifier may be the account email or the account display name. Display
        names are not unique; when two accounts share one, that identifier is refused
        with the generic invalid credentials response and the caller should use an
        email instead.

        An unknown account and a wrong password return the same 401 body, so the
        endpoint cannot be used to enumerate accounts.

        For an account with TOTP two-factor authentication enabled the password is
        only the first factor: the response is a `TwoFactorChallenge` instead of a
        `Session`, no cookies are set, and the login is completed by
        `POST /auth/login/2fa`. Accounts without 2FA are unaffected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                identifier:
                  type: string
                  description: |
                    Account email or display name. Preferred over `email`; when both
                    are present, this field wins.
                email:
                  type: string
                  format: email
                  deprecated: true
                  description: |
                    Legacy alias accepted for older clients; only read when
                    `identifier` is absent. It may itself carry either an email or a
                    display name.
                password: { type: string }
                captcha_token:
                  type: string
                  maxLength: 4096
                  description: |
                    Solved human verification token, when `GET /captcha/status` reports
                    `scenes.login`. Refused when missing and required (`400`,
                    `details.reason: captcha_required`), and a token can only be
                    redeemed once (`details.reason: captcha_replayed`).
      responses:
        '200':
          description: Session started, or a two-factor challenge when TOTP is enabled
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - $ref: '#/components/schemas/TwoFactorChallenge'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /auth/login/2fa:
    post:
      tags: [auth]
      summary: Complete a two-factor login
      description: |
        Redeems the short lived challenge that `POST /auth/login/password` returned for
        a two-factor protected account. The challenge token expires after five minutes,
        is single use, carries no role claim and cannot be used as an access token.

        A six digit TOTP code (RFC 6238, 30 second step, ±1 step clock drift) and one
        unused recovery code are both accepted. A time step is accepted exactly once,
        so a code cannot be replayed even inside the drift window; a recovery code is
        consumed on use. Wrong codes count towards the same account lockout as wrong
        passwords and answer 429 with `Retry-After` once it trips.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string, description: The `challenge_token` of the password login response. }
                code: { type: string, description: Six digit TOTP code, or one unused recovery code. }
      responses:
        '200':
          description: Session started
          headers:
            Set-Cookie:
              description: Sets the HttpOnly `pp_refresh` cookie and the readable `pp_csrf` cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/step-up:
    post:
      tags: [auth]
      summary: Re-authenticate for a high threat operation
      description: |
        Exchanges a password for a step-up grant that the high threat operations accept
        in the `X-PP-Step-Up` header. The product rule is one verification per browser
        session: the SPA keeps the grant in `sessionStorage`, so repeated high threat
        actions in the same session do not ask again while closing the browser does. The
        grant is bound to the calling account and to the site of its access token, is
        stateless and HMAC-SHA256 signed, and is not an access token: it cannot be used
        in `Authorization`. `expires_in` is the server-side hard cap (7 days) for a grant
        that outlives the browser session; rotating the signing key invalidates all
        outstanding grants.

        Check order: when `GET /sites/{siteID}/step-up` reports `password_set`, the
        site's dedicated security password is checked first; otherwise (or when it does
        not match) the caller's account login password is checked. A failure answers
        `403` with `details.reason: step_up_password_rejected` and is throttled by the
        credential rate limiter exactly like login, so repeated guesses are not a fast
        oracle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  maxLength: 128
                  description: |
                    The site's dedicated security password, or the caller's account
                    login password. Never echoed back and never logged.
      responses:
        '200':
          description: Step-up grant minted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpGrant' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/token/refresh:
    post:
      tags: [auth]
      summary: Rotate the session
      description: |
        Requires the `pp_refresh` cookie and a matching `X-CSRF-Token` header.
        The refresh token rotates on every success. Presenting an already rotated
        token revokes the whole token family, so both the client and an attacker holding
        the stolen token are logged out.
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: New access token and rotated refresh cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      description: Safe to retry; an unknown or already revoked token is not an error.
      security: []
      responses:
        '204':
          description: Session revoked and cookies cleared
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/password-reset/policy:
    get:
      tags: [auth]
      summary: Password reset availability
      description: |
        Reports whether this deployment can deliver reset links. The login page uses it
        to decide between offering "forgot password" and explaining that the operator has
        not configured an SMTP relay yet. It exposes no secret: only whether mail works,
        the link lifetime and the request cooldown.
      security: []
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                type: object
                required: [enabled, delivery, expires_in, cooldown]
                properties:
                  enabled: { type: boolean }
                  delivery: { type: string, enum: [email] }
                  expires_in: { type: integer, description: Reset link lifetime in seconds. }
                  cooldown: { type: integer, description: Minimum seconds between two requests for one account. }

  /auth/password-reset/request:
    post:
      tags: [auth]
      summary: Request a reset link
      description: |
        Sends a single use link to the address when it belongs to an account of this
        site. The response is identical for an unknown address, an account without a
        password, and a request dropped by the cooldown, so the endpoint cannot be used
        to enumerate accounts. Asking again invalidates the previous link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                captcha_token:
                  type: string
                  maxLength: 4096
                  description: |
                    Solved human verification token, when `GET /captcha/status` reports
                    `scenes.password_reset`. The link that the mail carries is itself a
                    single-use secret, so the redemption step is not challenged.
      responses:
        '202':
          description: Accepted. A message is sent only when the address has an account here.
          content:
            application/json:
              schema:
                type: object
                required: [status, delivery, expires_in]
                properties:
                  status: { type: string, const: accepted }
                  delivery: { type: string, enum: [email] }
                  expires_in: { type: integer }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          description: |
            No SMTP relay is configured (`details.reason: smtp_not_configured`), or the
            human verification service could not be reached
            (`details.reason: captcha_unavailable`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Redeem a reset link
      description: |
        Replaces the account password. The token is single use, expires after the
        advertised lifetime, and every live session of the account is revoked on
        success, so a stolen session cannot survive the reset.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: The `token` query parameter of the reset link. }
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  description: |
                    12–128 characters combining at least two of lowercase, uppercase,
                    digits and symbols; classic weak passwords are refused with
                    `details.rule: too_common`.
      responses:
        '204':
          description: Password replaced and sessions revoked
        '400':
          description: Malformed body, weak password, or an invalid or expired token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      tags: [auth]
      summary: Current user
      responses:
        '200':
          description: The authenticated account
          content:
            application/json:
              schema:
                type: object
                required: [user, role, site_id]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  role: { $ref: '#/components/schemas/Role' }
                  site_id: { type: string }
                  group_key:
                    type: string
                    description: |
                      Capability group the caller belongs to on this site. Omitted by
                      deployments that do not use permission groups; the client then
                      derives the built-in group from `role`.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/profile:
    patch:
      tags: [auth]
      summary: Update the current profile
      description: |
        Partial self-service update of the caller's own account. Only the fields present
        in the body change; an empty `bio` or `avatar_media_id` clears that field. The
        avatar must be a clean image uploaded by the caller on the current site, so
        another member's asset and a rejected upload are both refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 1, maxLength: 120 }
                bio: { type: string, maxLength: 2000, nullable: true }
                avatar_media_id: { type: string, maxLength: 36, nullable: true }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/password/change:
    post:
      tags: [auth]
      summary: Change the current password
      description: |
        Requires the current password even though the caller is authenticated, so an
        unattended browser session cannot take the account over. Success replaces the
        password and revokes every other refresh session of the account while keeping
        the caller's own session alive. The endpoint sits under `/auth` because the
        refresh cookie used to identify the caller's session is scoped to that path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 128 }
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  description: |
                    12–128 characters combining at least two of lowercase, uppercase,
                    digits and symbols; classic weak passwords are refused with
                    `details.rule: too_common`.
      responses:
        '204':
          description: Password replaced and other sessions revoked
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me/email/verification:
    post:
      tags: [auth]
      summary: Resend the email verification link
      description: |
        Sends a fresh single-use verification link to the caller's own email address.
        A verified account answers `already_verified` and sends nothing. The previous
        link is retired when a new one is issued, and requests are rate limited.
      responses:
        '202':
          description: Accepted (or already verified)
          content:
            application/json:
              schema:
                type: object
                required: [status, delivery, expires_in, already_verified]
                properties:
                  status: { type: string, enum: [accepted, already_verified] }
                  delivery: { type: string, enum: [email] }
                  expires_in: { type: integer, description: Link lifetime in seconds. }
                  already_verified: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/EmailNotConfigured'

  /me/2fa:
    get:
      tags: [auth]
      summary: Read the caller's two-factor state
      description: |
        Reports whether TOTP is active, when it was confirmed and how many recovery
        codes remain. The shared secret and the recovery codes are never returned.
      responses:
        '200':
          description: Two-factor state
          content:
            application/json:
              schema:
                type: object
                required: [enabled, recovery_codes_remaining]
                properties:
                  enabled: { type: boolean }
                  recovery_codes_remaining: { type: integer }
                  confirmed_at:
                    type: string
                    format: date-time
                    description: Present only while TOTP is enabled.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/2fa/enroll:
    post:
      tags: [auth]
      summary: Start a two-factor enrollment
      description: |
        Requires the current password even though the caller is signed in: this is the
        step that mints the long lived shared secret. Returns the base32 secret and the
        `otpauth://` URI to encode as a QR code. Starting again while an enrollment is
        pending replaces the secret; an already enabled authenticator has to be
        disabled first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Pending enrollment
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri, qr_content, expires_in]
                properties:
                  secret: { type: string, description: Unpadded base32 shared secret, shown once. }
                  otpauth_uri: { type: string, description: otpauth:// provisioning URI for authenticator apps. }
                  qr_content: { type: string, description: Payload to render as a QR code (the otpauth URI). }
                  expires_in: { type: integer, description: Advisory lifetime of a pending enrollment, in seconds. }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me/2fa/confirm:
    post:
      tags: [auth]
      summary: Confirm a two-factor enrollment
      description: |
        Verifies one six digit code against the pending secret, enables TOTP and
        returns the recovery codes. The plaintext codes are returned exactly once;
        afterwards only their hashes exist and the status endpoint reports how many
        are still unused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: Six digit TOTP code from the authenticator. }
      responses:
        '200':
          description: TOTP enabled; recovery codes are shown once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me/2fa/disable:
    post:
      tags: [auth]
      summary: Disable two-factor authentication
      description: |
        Turns TOTP off for the caller. Both the current password and a working second
        factor (a six digit code or one unused recovery code) are required, so a
        password alone or an unattended session cannot downgrade the account. Every
        recovery code is discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, maxLength: 128 }
                code: { type: string, description: Six digit TOTP code, or one unused recovery code. }
      responses:
        '204':
          description: TOTP disabled and audited
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me/2fa/recovery-codes:
    post:
      tags: [auth]
      summary: Regenerate recovery codes
      description: |
        Replaces every recovery code and returns the fresh set once. Requires the
        current password and a working second factor, so an open session cannot
        invalidate the codes the owner has written down.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, maxLength: 128 }
                code: { type: string, description: Six digit TOTP code, or one unused recovery code. }
      responses:
        '200':
          description: New recovery codes, shown once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/email/verify:
    post:
      tags: [auth]
      summary: Redeem an email verification link
      description: |
        Marks the email identity and the account level mirror as verified. The token is
        single use; an unknown, expired or already redeemed token answers the same 400
        so the endpoint cannot be used to probe links.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The `token` query parameter of the verification link. }
      responses:
        '204':
          description: Address verified
        '400':
          description: Malformed body, or an invalid or expired verification token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/oauth/{provider}/start:
    get:
      tags: [auth]
      summary: Start a third party login
      description: |
        Sends the browser to the authorization page of the provider. The response carries
        no body: the browser is the client of an authorization code flow, so the only
        output is the `Location` header and the state the server remembers for
        `GET /auth/oauth/{provider}/callback`.

        `site_id` decides which callback URI is registered with the provider. `redirect`
        is the in-site path the visitor returns to; it is accepted only as a rooted path
        without scheme, host or userinfo, and a value that fails that check is dropped
        instead of refused, so a stale link still signs the visitor in and they land on
        the site root. Both values are needed again at the callback, which is why the
        provider's redirect URI echoes them.

        A site that has not enabled the provider answers `404` with `code: not_found` and
        `details.reason: provider_disabled`; the client should hide the button rather than
        retry. A login attempt the server cannot record answers `400` with
        `details.reason: invalid_state`.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: site_id
          in: query
          required: true
          description: Site the login belongs to. It selects the callback URI registered with the provider.
          schema: { type: string }
        - name: redirect
          in: query
          required: false
          description: |
            In-site path the visitor returns to, for example `/dashboard`. Absolute URLs,
            protocol relative values and paths that are not rooted are ignored.
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the authorization page of the provider
          headers:
            Location:
              description: Authorization URL of the provider, carrying the minted state and the callback URI.
              schema: { type: string, format: uri }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: |
            The resolved site does not offer this provider. `details.reason:
            provider_disabled` says so; the endpoint itself exists, so a client hides the
            button instead of retrying.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: Finish a third party login
      description: |
        Receives the provider's answer, exchanges the code for a profile, resolves the
        profile to a local account and issues a session. The steps are ordered: a state
        that was already redeemed, has expired or belongs to another site stops the flow
        before an account is touched and before any cookie is set.

        Success is a `302` back into the site. The `Location` is the `redirect` target
        when it survived validation, else the landing page of the site, else `/`. The
        response sets the same session cookies a password login sets, so a client follows
        the redirect instead of reading a body.

        Failures answer `application/problem+json`. `400` carries `details.reason` set to
        `invalid_state` (unknown, replayed or expired state), `missing_code` (the provider
        returned no code), `provider_error` (the visitor refused or the application was
        revoked; `details.provider_reason` repeats the provider's wording) or
        `provider_disabled` (the site disabled the provider between start and callback).
        A provider that could not be used answers `502` with `details.reason` set to
        `exchange_failed` (the code could not be exchanged) or `profile_failed` (the
        profile could not be read); that is a failure of the provider, not of this
        server, and the visitor may retry the flow later.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: code
          in: query
          required: true
          description: Authorization code issued by the provider.
          schema: { type: string }
        - name: state
          in: query
          required: true
          description: State minted by `/auth/oauth/{provider}/start`. Single use and bound to the site.
          schema: { type: string }
        - name: site_id
          in: query
          required: false
          description: |
            Site the login started on, echoed back through the provider's redirect URI.
            Without it the login still completes, but the browser lands on `/`.
          schema: { type: string }
        - name: redirect
          in: query
          required: false
          description: |
            In-site return path echoed back through the provider. It is validated again
            here, so even a hand-built callback URL can only move the browser inside the
            site it already trusts.
          schema: { type: string }
        - name: error
          in: query
          required: false
          description: |
            Provider error code, present when the visitor refused the request or the
            application was revoked. Reported as `400` with `details.reason:
            provider_error`, never as an exchange failure.
          schema: { type: string }
      responses:
        '302':
          description: Login completed, redirect back into the site
          headers:
            Location:
              description: The requested in-site path, the landing page of the site, or `/`.
              schema: { type: string }
            Set-Cookie:
              description: Session cookies, same layout as a password login (HttpOnly `pp_refresh`, readable `pp_csrf`).
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          description: |
            The provider could not complete the login. `details.reason` is
            `exchange_failed` or `profile_failed`; `code` stays `internal` because the
            error table has no upstream code yet, so a client branches on the reason.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /users/{userID}:
    get:
      tags: [sites]
      summary: Public member profile
      description: |
        The header of an author archive: display name, site role and join time of one
        active member. No session is required on a `public` site; a `members_only` site
        refuses an anonymous request with 401. An account that is not an active member
        of the resolved site is not found.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /members:
    get:
      tags: [sites]
      summary: List active members of the resolved site
      description: |
        The signed-in member directory: any active member of the site may search it,
        and the response is the public profile projection only (no email, status or
        quota). Results are ordered by membership creation time and paginated with an
        opaque cursor. This is deliberately separate from
        `GET /sites/{siteID}/members`, which is the administration list.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case insensitive display name search.
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of members
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicUser' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /sites/{siteID}/audit-logs:
    get:
      tags: [sites]
      summary: Query a site's audit trail
      description: |
        Requires site administration on the site named in the path: a member or editor
        is refused. Filters map one-to-one to the `audit_logs` columns, so `action` is
        an exact code such as `content.published` or `site.settings.updated`.
        `from` and `to` are inclusive RFC 3339 timestamps. Rows are newest first and
        the cursor is opaque.
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on created_at (RFC 3339).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on created_at (RFC 3339).
          schema: { type: string, format: date-time }
        - name: actor_id
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          description: Exact action code, for example `content.published`.
          schema: { type: string, maxLength: 120 }
        - name: target_type
          in: query
          required: false
          schema: { type: string, maxLength: 40 }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
        - name: outcome
          in: query
          required: false
          schema: { type: string, maxLength: 20 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of audit rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '400':
          description: Malformed filter, limit or cursor
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /platform/sites:
    get:
      tags: [platform]
      summary: List every site of the deployment
      description: |
        Requires a platform administrator seat on the site resolved from the request
        host. The console is deployment level: a site administrator only manages its own
        site and never sees the install wide list.
      responses:
        '200':
          description: Sites ordered by creation time
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformSite' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [platform]
      summary: Create a site with its first administrator
      description: |
        Requires a platform administrator seat on the resolved site. The console's own
        site must already have a verified primary domain: creating a second site ends the
        domain-less single-site fallback, so the console would otherwise become
        unreachable as soon as the request succeeds. The site is created
        together with its default design document and its first administrator account,
        which is always a site administrator of the new site. A declared primary domain
        starts a DNS TXT challenge and does not serve until it is verified, exactly like
        a domain set through site settings; `POST /platform/sites/{siteID}/domain/verify`
        redeems it from the console. If the administrator account cannot be
        created (for example an already registered email) the new site is removed again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSiteInput' }
      responses:
        '201':
          description: Site and its first administrator created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedSite' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /platform/sites/{siteID}:
    get:
      tags: [platform]
      summary: One site of the deployment
      description: |
        Available to a platform administrator of the resolved site and to an active
        administrator of the target site itself.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: The site and the caller's role on it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSiteDetail' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/sites/{siteID}/enter:
    post:
      tags: [platform]
      summary: Enter a site context
      description: |
        Available to a platform administrator of the resolved site and to an active
        administrator of the target site. When the target is another site with a verified
        domain, the response carries a short lived handoff token; the browser redeems it
        with `POST /platform/enter/claim` on the target site's own origin and receives a
        normal session there. The console's access token is never reused against the
        target tenant. A platform administrator receives a platform administrator
        membership on the target site, because every site endpoint re-reads a live
        membership.

        Entering the already resolved site is always switchable and needs no token.
        Otherwise `switchable` is false and `reason` is `site_disabled`, `domain_missing`
        or `domain_unverified`.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Handoff decision for the target site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSiteEntry' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/sites/{siteID}/domain/verify:
    post:
      tags: [platform]
      summary: Redeem a site's DNS ownership challenge
      description: |
        Runs the pending TXT challenge of the target site. It is the bootstrap path for a
        site created from the console: the site's own admin area is only reachable after
        its hostname verifies, so the challenge cannot be completed there first. Available
        to a platform administrator of the resolved site or an administrator of the target
        site. A mismatch or DNS failure answers 409 with reason
        `domain_verification_failed`; the operator fixes the record and retries.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Domain state after the challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDomainStatus' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /platform/overview:
    get:
      tags: [platform]
      summary: Deployment wide operational overview
      description: |
        Requires a platform administrator seat on the site resolved from the request
        host. Aggregates every tenant, which no site role reaches on its own: site status,
        member, content and comment counts, the moderation backlog, recent failures and
        the audit rows written inside the window. Inventory counters are current totals;
        only the activity counters and the recent rows are windowed. The payload carries
        counters, statuses and booleans only.
      parameters:
        - name: window_days
          in: query
          required: false
          description: Width of the activity window in days (1-30). 7 when omitted.
          schema: { type: integer, minimum: 1, maximum: 30 }
      responses:
        '200':
          description: The deployment snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOverview' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /platform/audit-logs:
    get:
      tags: [platform]
      summary: Query the audit trail across sites
      description: |
        Requires a platform administrator seat on the resolved site. The same filter
        vocabulary as `GET /sites/{siteID}/audit-logs`, except that `site_id` is optional
        and an omitted value means every site of the install rather than a site that has
        no rows. Rows are newest first and the cursor is opaque. The query is itself
        audited as `platform.audit.queried`: failing to write that row fails the request
        instead of leaving an unrecorded disclosure.
      parameters:
        - name: site_id
          in: query
          required: false
          description: Restrict the page to one site; omitted means every site.
          schema: { type: string, maxLength: 36 }
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on created_at (RFC 3339).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on created_at (RFC 3339).
          schema: { type: string, format: date-time }
        - name: actor_id
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          description: Exact action code, for example `platform.site.created`.
          schema: { type: string, maxLength: 120 }
        - name: target_type
          in: query
          required: false
          schema: { type: string, maxLength: 40 }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
        - name: outcome
          in: query
          required: false
          schema: { type: string, maxLength: 20 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of audit rows across sites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '400':
          description: Malformed filter, limit or cursor
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /platform/users:
    get:
      tags: [platform]
      summary: List deployment accounts or one site's members
      description: |
        Requires a platform administrator seat on the resolved site. Read only: role and
        status changes stay in the site administration endpoints, where their membership
        and audit rules live. Without `site_id` the page is every account of the install
        newest first; with one it is that site's memberships newest first. Each row
        carries the account, its email verification state, whether a confirmed
        authenticator exists (a boolean, never the secret) and the sites it belongs to.
      parameters:
        - name: site_id
          in: query
          required: false
          description: Restrict the page to the memberships of one site.
          schema: { type: string, maxLength: 36 }
        - name: q
          in: query
          required: false
          description: Case insensitive match on the display name or the email address.
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAccountPage' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /platform/enter/claim:
    post:
      tags: [platform]
      summary: Redeem a site handoff token
      description: |
        Called on the target site's own origin, where the browser holds no session yet.
        The signed, two minute token is the credential. It must have been minted for the
        site the request host resolves to, and the account must still hold an active
        membership. A success answers exactly like a password login, including the
        `pp_refresh` and `pp_csrf` cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteSwitchClaim' }
      responses:
        '200':
          description: Session established on the target site
          headers:
            Set-Cookie:
              description: HttpOnly refresh cookie scoped to `/api/v1/auth`, plus the readable CSRF cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/backups:
    get:
      tags: [platform]
      summary: List stored instance backups
      description: |
        Requires a platform administrator seat. Backups contain the whole deployment
        database, so a site administrator never sees this list. Corrupt metadata
        sidecars are skipped rather than hiding every healthy package.
      responses:
        '200':
          description: Stored backup packages newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BackupArtifact' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [platform]
      summary: Create an instance backup
      description: |
        Requires a platform administrator seat. The package contains a consistent
        SQLite snapshot (`VACUUM INTO`), every local media root, the saved design
        document of every site, and a manifest with a SHA-256 for every entry.
        MySQL and PostgreSQL are refused: this process does not shell out to
        mysqldump/pg_dump, so operators must use their native dump tool and back up
        media separately. S3 media roots are recorded as warnings, never silently
        included.
      responses:
        '201':
          description: Package created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupArtifact' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /platform/backups/{backupID}/download:
    get:
      tags: [platform]
      summary: Download a stored backup package
      description: Requires a platform administrator seat.
      parameters:
        - name: backupID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Zip package
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/export:
    get:
      tags: [backups]
      summary: Export a whole site as a portable zip
      description: |
        Requires an active site administrator of the target site. The package holds
        one front-matter Markdown file per item (title, status, category, tags,
        published_at, access and comment modes), the referenced media, site.json,
        design.json and pages.json. Set `published_only=true` to leave drafts and
        archived items out. Media that cannot be read is reported through warnings
        while the export still succeeds.
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: published_only
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Zip package
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/import:
    post:
      tags: [backups]
      summary: Import a site export
      description: |
        Requires an active site administrator of the target site. Items become
        drafts; the review workflow still decides publication. `conflict` controls a
        slug that already exists: `rename` (default) appends -2, -3, ..., `skip`
        leaves the existing item alone, `fail` reports the item as failed, and
        `overwrite` updates the existing item through the normal draft save.
        Every item is reported separately; media created for a failed item is
        removed again, and images are deduplicated by content hash.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                conflict:
                  type: string
                  enum: [rename, skip, fail, overwrite]
                  default: rename
      responses:
        '200':
          description: Per item import report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteImportReport' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /sites/{siteID}:
    get:
      tags: [sites]
      summary: Site details for a member
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: The site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /sites/{siteID}/members:
    get:
      tags: [sites]
      summary: List site members
      description: Requires site administrator authority.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Members of the site
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [sites]
      summary: Create a member account
      description: |
        Requires site administrator authority and applies to the caller's own site.
        Only a platform administrator may create another platform administrator. The
        account is created without a session; the administrator hands the initial
        password to its owner. Personal blog installs pass `site_admin` so the account
        can sign in to the admin area.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMember' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{siteID}/members/{userID}/role:
    patch:
      tags: [sites]
      summary: Change a member role
      description: |
        Requires site administrator authority. Only a platform administrator may grant
        or revoke the `platform_admin` role, or demote an existing platform administrator.
        The last active platform administrator of a site can never be demoted.

        This is the coarse role endpoint. A successful call also moves the membership
        back to the built-in capability group of the new role, so a custom group whose
        base role no longer matches can never stay attached. Use
        `PATCH /sites/{siteID}/members/{userID}/group` to assign a custom group.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: userID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '204':
          description: Role changed and audited
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/members/{userID}/group:
    patch:
      tags: [sites]
      summary: Move a member into a capability group
      description: |
        Requires the `manage_member` capability. The group's base role becomes the
        account's server role and the group matrix is applied on top, so a custom
        group can narrow a role without inventing a new one. The guest group cannot
        be assigned: it has no account. Promoting to the built-in owner group (the
        `platform_admin` role) still requires a platform administrator, and the last
        active platform administrator cannot be demoted.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMemberGroup' }
      responses:
        '204':
          description: Membership moved to the group and audited
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/permission-groups:
    get:
      tags: [sites]
      summary: List capability groups
      description: |
        Returns the built-in groups plus every custom group of the site. Any active
        member may read the matrix: the dashboard needs it to decide which interface
        areas to show. Writes are enforced separately by `manage_permission`.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Capability groups of the site
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PermissionGroup' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /sites/{siteID}/permission-groups/{groupKey}:
    put:
      tags: [sites]
      summary: Create or update a capability group
      description: |
        Requires the `manage_permission` capability, which the built-in owner group
        always keeps and a custom group can never hold. Built-in keys keep their
        role mapping; only the label and the matrix can change. A new key creates a
        custom group whose base role must be `member`, `editor` or `site_admin`;
        its capabilities must be a subset of that role's capabilities, so a custom
        group can narrow a role but never exceed it.
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: groupKey
          in: path
          required: true
          schema: { type: string, maxLength: 36 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionGroupInput' }
      responses:
        '200':
          description: Stored group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionGroup' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/members/{userID}:
    patch:
      tags: [sites]
      summary: Update a member profile
      description: |
        Requires platform administrator authority and applies to the caller's own site.
        Only lower ranked accounts may be edited: neither the caller itself nor another
        platform administrator can be changed. The email is the login identity and is
        unique across the install.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMember' }
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [sites]
      summary: Remove a member from the site
      description: |
        Requires platform administrator authority and applies to the caller's own site.
        Removes the site membership, not the account: content, comments and memberships
        of other sites are preserved. The member can no longer refresh a session on this
        site afterwards.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/StepUpToken'
      responses:
        '204':
          description: Membership removed
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/members/{userID}/status:
    patch:
      tags: [sites]
      summary: Suspend or reactivate a member
      description: |
        Requires platform administrator authority and applies to the caller's own site.
        Only lower ranked accounts may be suspended: neither the caller itself nor
        another platform administrator can be changed. A suspended membership cannot
        log in or refresh a session until it is reactivated.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberStatus' }
      responses:
        '200':
          description: Membership status changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/members/{userID}/quota:
    patch:
      tags: [sites]
      summary: Update a member media quota override
      description: |
        Requires site administrator authority on the caller's own site. The member's
        override affects storage quotas for that member only. An omitted
        `media_quota_bytes` leaves the value unchanged; `null` clears the override and
        inherits the site's effective quota; `0` explicitly means unlimited; a positive
        value sets the maximum number of bytes.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_quota_bytes:
                  $ref: '#/components/schemas/MediaQuotaBytes'
      responses:
        '200':
          description: The current member record after applying the override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/members/{userID}/2fa/reset:
    post:
      tags: [sites]
      summary: Reset a member's two-factor authentication
      description: |
        Clears a member's authenticator and every recovery code so an account whose
        device is lost can sign in again with its password. Requires platform
        administrator authority on the caller's own site, and is audited. Resetting an
        account that has no authenticator is a no-op. The caller cannot reset itself:
        together with a stolen session that would be a silent way around TOTP.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/StepUpToken'
      responses:
        '204':
          description: Authenticator cleared and audited
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/settings:
    patch:
      tags: [sites]
      summary: Update site settings
      description: Partial update; omitted fields are left unchanged. Requires site administrator authority.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 160 }
                description: { type: string, maxLength: 2000 }
                visibility_mode: { $ref: '#/components/schemas/VisibilityMode' }
                publish_mode: { $ref: '#/components/schemas/PublishMode' }
                registration_open:
                  type: boolean
                  description: |
                    Whether anonymous visitors may create a member account. Omitted means
                    unchanged. Closing registration does not affect existing members or
                    administrator-created accounts.
                comments_enabled:
                  type: boolean
                  description: |
                    Whether new comments may be written. Omitted means unchanged. Closing
                    comments keeps existing rows and makes POST /comments answer 403 with
                    reason `comments_closed`.
                comments_require_review:
                  type: boolean
                  description: |
                    Whether new comments enter `pending_review` instead of publishing
                    immediately. Omitted means unchanged. Only a moderator may approve or
                    reject them.
                media_quota_bytes:
                  $ref: '#/components/schemas/MediaQuotaBytes'
                domain:
                  type: string
                  description: |
                    Convenience field kept for existing clients; a non-empty value is
                    validated, stored together with a new DNS TXT challenge token and is
                    not verified until POST /sites/{siteID}/domain/verify succeeds. Use
                    PUT /sites/{siteID}/domain to clear a domain.
      responses:
        '204':
          description: Settings updated and audited
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /sites/{siteID}/step-up:
    get:
      tags: [sites]
      summary: Read the high threat operation protection
      description: |
        Requires site administrator authority. Returns the masked settings:
        `password_set` says whether a dedicated security password exists, never the
        hash or the password itself. `window_seconds` is the server-side hard cap for a
        minted `X-PP-Step-Up` grant; the effective scope is one browser session.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: The masked step-up settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpSettings' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [sites]
      summary: Update the high threat operation protection
      description: |
        Requires `manage_site` on the caller's own site. Partial update: omitted
        properties are left unchanged.

        The first save of a site that neither enabled protection nor set a dedicated
        password is accepted directly, so enabling the feature cannot be a privilege
        escalation. Every later change (including disabling it or replacing the
        dedicated password) must carry a valid `X-PP-Step-Up` grant minted by
        `POST /auth/step-up`; without one the answer is `403` with
        `details.reason: step_up_required`.

        `password` sets a dedicated security password, stored only as an Argon2id
        hash. Sending both `password` and `clear_password` is a `400`.
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpSettingsUpdate' }
      responses:
        '200':
          description: The settings after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpSettings' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{siteID}/safety:
    get:
      tags: [sites]
      summary: Read content safety policy
      description: |
        Requires site administrator authority on the caller's own site. Returns the
        comment frequency limits, the sensitive word list and the IP allow and deny
        rules. A site that has never saved limits answers the documented defaults
        (5 comments per member, 10 per address, 60 second window), so the screen
        always has concrete numbers.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: The resolved safety policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyPolicy' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    patch:
      tags: [sites]
      summary: Update comment frequency limits
      description: |
        Partial update; omitted fields are left unchanged. Requires site administrator
        authority. `user_per_window` counts signed-in comments per member, while
        `ip_per_window` counts comments per client address for anonymous and
        signed-in callers alike; `0` disables that counter. Exceeding a window
        answers `429` with `Retry-After` on `POST /comments`.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SafetyRateLimitUpdate' }
      responses:
        '200':
          description: The limits after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyRateLimit' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /sites/{siteID}/safety/words:
    post:
      tags: [sites]
      summary: Add a sensitive word
      description: |
        Requires site administrator authority. Words are stored trimmed and
        lower-cased; the match is case-insensitive. `mode` chooses what a match does:
        `reject` refuses the submission with `403` reason `sensitive_word`, `replace`
        rewrites it to `replacement` (default `***`), `review` stores it as
        `pending_review`. Words shorter than 2 characters are refused so a single
        character cannot mangle ordinary prose.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSensitiveWord' }
      responses:
        '201':
          description: Word created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensitiveWord' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{siteID}/safety/words/{wordID}:
    patch:
      tags: [sites]
      summary: Change a sensitive word action
      description: |
        Requires site administrator authority. The word itself is immutable; delete
        and re-create it to change the spelling. The decision is audited.
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: wordID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitiveWordUpdate' }
      responses:
        '200':
          description: Word updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensitiveWord' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [sites]
      summary: Delete a sensitive word
      description: |
        Requires site administrator authority. The deletion is audited.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: wordID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/StepUpToken'
      responses:
        '204':
          description: Word deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/safety/ip-rules:
    post:
      tags: [sites]
      summary: Add an IP allow or deny rule
      description: |
        Requires site administrator authority. `value` is one IPv4/IPv6 address or a
        CIDR block and is canonicalised on write. A deny rule always wins; as soon as
        any allow rule exists the site only accepts listed addresses. Loopback is
        always allowed so an operator cannot lock themselves out. Reaching a denied
        site answers `403` with reason `ip_blocked`.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSiteIPRule' }
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteIPRule' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{siteID}/safety/ip-rules/{ruleID}:
    delete:
      tags: [sites]
      summary: Delete an IP allow or deny rule
      description: |
        Requires site administrator authority. The deletion is audited.

        High threat operation: while the site enables the protection, the request also
        needs a valid `X-PP-Step-Up` grant (`403` reason `step_up_required` otherwise).
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: ruleID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/StepUpToken'
      responses:
        '204':
          description: Rule deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/contact:
    post:
      tags: [sites]
      summary: Send a message from the contact form
      description: |
        Anonymous write: the reader who wants to write to the site owner is exactly the
        person who has no account. The message is delivered as one in-app notification
        to every active administrator of the site; it is not stored anywhere else, and a
        site with no administrator answers `202` and delivers nothing.

        The body is bounded: `name` (optional, 80 bytes), `email` (optional, 200 bytes,
        must contain `@`) and `message` (required, 2000 characters). The text is stored
        and rendered as plain text and is never interpreted as markup or HTML.

        Anti abuse, in the order the server applies it: `website` is a honeypot field the
        browser keeps hidden — a non-empty value answers `202` and delivers nothing, so
        a bot cannot tell it was caught; then validation (`400`); then a 60 second
        per-visitor cooldown (`429`), which is held in process and therefore per instance
        — a multi-instance deployment relies on the gateway rate limiter for the fleet
        wide bound. Rejected submissions do not consume the cooldown.
      security: []
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMessageInput' }
      responses:
        '202':
          description: |
            Accepted. Also the answer to a submission that tripped the honeypot: the
            response deliberately does not reveal whether anything was delivered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMessageAccepted' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /sites/{siteID}/customization:
    get:
      tags: [sites]
      summary: Site design document
      description: |
        The design a browser renders the site from: theme tokens, layout, the page
        builder's pages and blocks, custom CSS and pinned articles.

        Anonymous read: every visitor needs this before the first paint. The request host
        must resolve to `siteID`, so the path cannot select another tenant's design. On a
        members-only site the document names the private pages, so a caller who is not an
        active member gets the same `404` a site that never saved a design returns.
      security: []
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: The saved design document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteCustomization' }
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [sites]
      summary: Store the site design document
      description: |
        Requires site administrator authority on the caller's own site.

        The document is opaque to the server: it must be a JSON object and at most 1 MiB,
        and it is stored byte for byte. Send `revision` to make the write conditional; a
        stale revision is refused with `409` instead of silently overwriting an edit made
        in another tab or by another administrator.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteCustomizationInput' }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteCustomizationSaved' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{siteID}/site-config:
    get:
      tags: [sites]
      summary: Site runtime configuration
      description: |
        The site level settings a visitor's browser executes: the access limits, the
        loading screen, the site's bound domains and the administrator entry path.
        They used to live only in the site owner's `localStorage`, so a visitor on
        another device silently received the built-in defaults.

        Anonymous read. The visitor receives a projection; an active manager of the
        site receives the whole document (`scope: admin`), which adds the
        administrator-only fields: TLS certificate paths, CORS origins, cookie domain,
        trusted proxies, the gateway / API / database tuning values and the login
        providers' client ids and redirect URIs. The provider switches themselves are
        public (`auth.<id>.enabled` only), because the login page has to know which
        buttons to draw; the API does not implement the providers themselves.

        On a members-only site a caller who is not an active member gets the same `404`
        a site that never saved a configuration returns. The response is `private,
        no-cache` and its strong `ETag` includes the audience, so a cached administrator
        document never validates an anonymous response.
      security: []
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: The saved configuration, or its public projection
          headers:
            ETag:
              schema: { type: string }
              description: Strong validator; send it back as If-None-Match.
            Cache-Control:
              schema: { type: string }
              description: Always `private, no-cache` because the body differs by audience.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteConfig' }
        '304':
          description: The caller's cached copy is still current
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [sites]
      summary: Store the site runtime configuration
      description: |
        Requires site administrator authority on the caller's own site.

        The document is validated field by field (numeric ranges, the admin path and
        the loading screen's custom CSS) and then stored byte for byte. Unknown
        sections are rejected on the way out, not on the way in. Send `revision` to
        make the write conditional; a stale revision is refused with `409`
        (`config_revision_conflict`) instead of silently overwriting a change made on
        another device or in another tab. Omitting it is an unconditional write, which
        is what the first save of a fresh install sends.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteConfigInput' }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteConfigSaved' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{siteID}/domain:
    get:
      tags: [sites]
      summary: Domain verification state
      description: |
        Requires site administrator authority and applies to the caller's own site.
        Returns the primary domain, whether a DNS TXT challenge has proven it, and,
        while pending, the record name and token the operator must publish. A verified
        domain returns an empty `verification_token`.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDomainStatus' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [sites]
      summary: Set or clear the site domain
      description: |
        Requires site administrator authority and applies to the caller's own site.
        A non-empty domain is stored together with a fresh DNS TXT challenge token and
        `domain_verified_at = NULL`; the site only becomes reachable on it after
        POST /sites/{siteID}/domain/verify proves ownership. While the challenge is
        pending the site stays reachable from loopback / IP-literal hosts so the
        operator can finish the check. An empty string clears the domain, its token and
        its verification and restores the domain-less fallback.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteDomainInput' }
      responses:
        '204':
          description: Domain updated and audited
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{siteID}/domain/verify:
    post:
      tags: [sites]
      summary: Verify domain ownership
      description: |
        Requires site administrator authority. Looks up the TXT record
        `_practacu-verify.<domain>` and marks the domain verified when any value equals
        the stored challenge token. A missing record or a mismatch answers `409` with
        detail reason `domain_verification_failed`; verifying an already verified domain
        is idempotent; without a pending challenge it answers `400`. Declaring the
        domain (PUT /sites/{siteID}/domain) mints the challenge.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Domain state after the attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDomainStatus' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /articles:
    get:
      tags: [content]
      summary: List articles
      description: |
        Readers only ever see published public items; editors also see the review
        queue. Password and members-only items are direct-link-only and never appear
        in a listing, so a browsing reader cannot discover them. Anonymous visitors may
        read a site whose visibility mode is `public`; on a `members_only` site the call
        is refused with 401. `author_id` narrows the page to one author's visible items,
        which is what the author archive uses.
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AuthorID'
        - $ref: '#/components/parameters/CategoryID'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Trashed'
      responses:
        '200':
          description: One page of articles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPage' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [content]
      summary: Create a draft
      description: |
        The body is sanitized by the security service. If that service is unavailable the
        draft is stored in `pending_security_check` and the response is 503: content is
        preserved but cannot be published.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftInput' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /search:
    get:
      tags: [content]
      summary: Search published content
      description: |
        Full text search over published public items, ordered by relevance on every
        supported database: SQLite FTS5, MySQL/MariaDB FULLTEXT with the ngram parser,
        and PostgreSQL tsvector with a GIN index. The index stores one token per CJK
        rune and one per Latin/digit word, so a Chinese phrase and an English word are
        matched the same way on all three.

        Only published public items are searched, so a draft, an archived item or a
        password/members-only item can never be discovered through search. The term is
        matched as text, never as syntax: wildcards and quotes are ordinary
        characters, and a term with no letter or digit answers an empty page instead
        of matching everything. Anonymous reads follow the site visibility rule.

        Paging is a real cursor over the relevance order: pass `next_cursor` back as
        `cursor`. Items with equal scores are ordered by id, so no page repeats or
        skips an item, and a boundary minted by the degradation fallback is rejected
        rather than misapplied. `total` is the number of matches across every page.

        `degraded` is true when the full text index was unavailable and the server
        answered from the portable LIKE fallback, which is ordered by creation time,
        not relevance. A client should say so instead of implying a relevance order.

        `snippet` is plain text around the first match, never HTML: the client escapes
        it and applies its own highlighting, so a search term cannot inject markup.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search term, 2 to 100 characters. Longer terms are truncated.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: kind
          in: query
          required: false
          description: Narrow the page to one content kind.
          schema: { type: string, enum: [article, post] }
        - $ref: '#/components/parameters/CategoryID'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/AuthorID'
        - $ref: '#/components/parameters/Since'
        - name: until
          in: query
          required: false
          description: Only items created at or before this instant (RFC 3339).
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: highlight
          in: query
          required: false
          description: |
            Return a plain text `snippet` per item. Defaults to true; only `false`,
            `0`, `off` or `no` disables it.
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: One relevance ordered page of matches
          content:
            application/json:
              schema:
                type: object
                required: [items, total, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Content'
                        - type: object
                          properties:
                            snippet:
                              type: string
                              description: |
                                Plain text excerpt around the first match. Never HTML:
                                the client escapes it and highlights the term itself.
                  total:
                    type: integer
                    description: Number of matches across every page.
                  next_cursor:
                    type: string
                    description: |
                      Opaque boundary of the next page, empty on the last page. Send it
                      back as `cursor`.
                  has_more:
                    type: boolean
                  degraded:
                    type: boolean
                    description: |
                      True when the full text index was unavailable and the portable
                      LIKE fallback answered, which orders by creation time.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /articles/{contentID}:
    get:
      tags: [content]
      summary: Read an article
      description: |
        Anonymous reads are allowed on a public site, and only for published items.
        A `members` item requires a signed in reader and a `password` item requires the
        `unlock` action first; both answer 403 with `details.reason` set to
        `members_only` or `password_required`. A successful read counts one view of the
        item for the leaderboard (FSD A-16); the author's and an editor's own reads are
        not counted, and `X-Visit-Session` de-duplicates one reader.
      security: []
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - $ref: '#/components/parameters/VisitSession'
        - name: preview_token
          in: query
          required: false
          description: |
            Beta 1.2. Draft preview grant minted by the preview endpoint. A valid token
            lets a caller without a session read this unpublished item; an invalid or
            expired one is answered exactly like a missing item.
          schema: { type: string }
      responses:
        '200':
          description: The article
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [content]
      summary: Edit a draft or revise a published article
      description: |
        Published content is revised in place: every save snapshots the new state
        into the item's bounded revision history, so the previous text stays
        restorable. Each save is sanitized again.
      parameters:
        - $ref: '#/components/parameters/ContentID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftInput' }
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/ContentStateInvalid'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'
    delete:
      tags: [content]
      summary: Move an article to the trash
      description: |
        Soft delete (Beta 1.2). The row, its revisions and everything pointing at it
        stay, so the item is restorable losslessly with the `undelete` action. While it
        is trashed it is absent from every listing, search result, feed and sitemap and
        a reader gets the ordinary 404. Only the author or an editor may trash an item.
        Trashing an already trashed item succeeds without changing `deleted_at`.
      parameters:
        - $ref: '#/components/parameters/ContentID'
      responses:
        '200':
          description: The trashed article, with `deleted_at` set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /articles/{contentID}/{action}:
    post:
      tags: [content]
      summary: Apply a workflow action
      description: |
        `action` is one of `submit`, `publish`, `reject`, `archive`, `restore`,
        `security-retry` or `unlock`. The site publish mode decides whether an author
        may publish directly; authors can never approve their own pending content.
        `unlock` is the password action of a password protected item (C-18): it is the
        only action an anonymous reader may perform, it is rate limited and locks the
        client/content pair after repeated failures, and on success it returns a
        `ContentUnlockResult` and sets an HttpOnly session cookie that authorizes
        reading the item.
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [submit, publish, reject, archive, restore, security-retry, unlock, undelete, purge]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                password:
                  type: string
                  format: password
                  description: Required by `unlock`; the plaintext access password.
                  maxLength: 128
      responses:
        '200':
          description: |
            New state of the item, or the unlock grant for the `unlock` action. A
            trashed item answers with just its `undelete` and `purge` actions; the
            `undelete` action returns the restored item in this same shape.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Content'
                  - $ref: '#/components/schemas/ContentUnlockResult'
        '204':
          description: |
            Beta 1.2. `purge` only: the item and its revisions are gone for good and
            there is no representation left to return.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ContentStateInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /articles/{contentID}/revisions:
    get:
      tags: [content]
      summary: List the revision history of an article
      description: |
        Newest first, at most 20 versions. Readable by the item's author and by
        editors; anyone else receives 404 so a private item's existence is not
        disclosed. The list omits the source body; fetch one revision to read it.
      parameters:
        - $ref: '#/components/parameters/ContentID'
      responses:
        '200':
          description: The bounded history of the article
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRevisionPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /articles/{contentID}/revisions/{revisionID}:
    get:
      tags: [content]
      summary: Read one article version
      description: Returns the stored source and rendered HTML of a history entry.
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - $ref: '#/components/parameters/RevisionID'
      responses:
        '200':
          description: The full version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRevision' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /articles/{contentID}/revisions/{revisionID}/restore:
    post:
      tags: [content]
      summary: Restore an article version
      description: |
        The current state is written as a `rollback_backup` version before the
        target is applied, so a rollback can itself be undone. The workflow status
        is preserved and the restored text is sanitized again; a failed security
        check of a published item returns 503 and leaves the live item untouched.
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - $ref: '#/components/parameters/RevisionID'
      responses:
        '200':
          description: The article after the rollback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ContentStateInvalid'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /posts:
    get:
      tags: [content]
      summary: List posts
      description: Anonymous reads follow the same visibility rule as articles.
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AuthorID'
        - $ref: '#/components/parameters/CategoryID'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Trashed'
      responses:
        '200':
          description: One page of posts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [content]
      summary: Create a post draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftInput' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /posts/{contentID}:
    get:
      tags: [content]
      summary: Read a post
      description: |
        Anonymous reads are allowed on a public site, and only for published items.
        `members` posts need a signed in reader and `password` posts need the `unlock`
        action, mirroring articles. A successful read counts one view of the post for
        the leaderboard (FSD A-16), with the same self-read and de-duplication rules.
      security: []
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - $ref: '#/components/parameters/VisitSession'
        - name: preview_token
          in: query
          required: false
          description: |
            Beta 1.2. Draft preview grant minted by the preview endpoint. A valid token
            lets a caller without a session read this unpublished item; an invalid or
            expired one is answered exactly like a missing item.
          schema: { type: string }
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [content]
      summary: Edit a post draft or revise a published post
      parameters:
        - $ref: '#/components/parameters/ContentID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftInput' }
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '409':
          $ref: '#/components/responses/ContentStateInvalid'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'
    delete:
      tags: [content]
      summary: Move a post to the trash
      description: |
        Soft delete (Beta 1.2), identical in behaviour to the article variant: the item
        stays restorable with `undelete` until it is purged, and is invisible to readers
        meanwhile.
      parameters:
        - $ref: '#/components/parameters/ContentID'
      responses:
        '200':
          description: The trashed post, with `deleted_at` set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{contentID}/{action}:
    post:
      tags: [content]
      summary: Apply a workflow action to a post
      description: |
        The same workflow actions as an article, including the `unlock` action for a
        password protected post (C-18).
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [submit, publish, reject, archive, restore, security-retry, unlock, undelete, purge]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                password: { type: string, format: password, maxLength: 128 }
      responses:
        '200':
          description: |
            New state of the item, or the unlock grant for the `unlock` action. A
            trashed item answers with just its `undelete` and `purge` actions; the
            `undelete` action returns the restored item in this same shape.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Content'
                  - $ref: '#/components/schemas/ContentUnlockResult'
        '204':
          description: |
            Beta 1.2. `purge` only: the item and its revisions are gone for good and
            there is no representation left to return.
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/ContentStateInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'

  /posts/{contentID}/revisions:
    get:
      tags: [content]
      summary: List the revision history of a post
      description: |
        Newest first, at most 20 versions. Readable by the item's author and by
        editors; anyone else receives 404.
      parameters:
        - $ref: '#/components/parameters/ContentID'
      responses:
        '200':
          description: The bounded history of the post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRevisionPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{contentID}/revisions/{revisionID}:
    get:
      tags: [content]
      summary: Read one post version
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - $ref: '#/components/parameters/RevisionID'
      responses:
        '200':
          description: The full version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRevision' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{contentID}/revisions/{revisionID}/restore:
    post:
      tags: [content]
      summary: Restore a post version
      description: |
        The current state is written as a `rollback_backup` version before the
        target is applied. The workflow status is preserved and the restored text
        is sanitized again.
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - $ref: '#/components/parameters/RevisionID'
      responses:
        '200':
          description: The post after the rollback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ContentStateInvalid'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /content/popular:
    get:
      tags: [content]
      summary: Popular content
      description: |
        The most read published items of the site, ranked by reads decayed by
        publication age: `score = view_count / (hours_since_publish + 2)^1.5`. The
        decay lets a strong item stay on top for a day or two and then yields to newer
        traffic, so the board follows current interest instead of lifetime totals.

        `view_count` is written by the server when it serves a published item; it is not
        derived from the analytics page view ledger. Reads by the item's own author and
        by editors are not counted, and one reader counts at most once per item inside a
        30 minute window.

        Only published public items compete inside `window`: a draft, an archived item
        and a password or members-only item are direct-link-only and never appear on a
        leaderboard. A site with no reads yet gets its newest items, because every item
        then scores zero and the tie-breaker is publication date.
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Narrow the board to one content kind.
          schema: { type: string, enum: [article, post] }
        - $ref: '#/components/parameters/CategoryID'
        - $ref: '#/components/parameters/Tag'
        - name: window
          in: query
          required: false
          description: |
            Ranking horizon and decay scale. Only items published inside it compete;
            defaults to `30d`.
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the leaderboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PopularContentPage' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /comments:
    get:
      tags: [community]
      summary: List comments
      description: |
        Public reads are allowed on a site whose visibility mode is `public`; a
        members-only site requires a session. Readers without moderation rights only
        ever receive `visible` comments. Moderators may filter by any status, or pass
        `status=all` to read the whole moderation queue.
      parameters:
        - name: target_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TargetType' }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, visible, hidden, deleted, pending_review]
        - name: q
          in: query
          required: false
          description: Matches the comment body and the author display name.
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of comments, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [community]
      summary: Comment on a target
      description: |
        Replies are created by targeting a comment. Nesting is capped server side; a
        deeper reply is refused.

        The write is filtered by the host-resolved site's content safety policy:
        a matched `reject` word answers `403` with reason `sensitive_word`, a matched
        `review` word stores the comment as `pending_review`, and a matched
        `replace` word stores the rewritten body. Signed-in and anonymous writes are
        counted against the site's per-user and per-IP frequency windows; exceeding
        one answers `429` with a `Retry-After` header and
        `details.retry_after_seconds`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, body]
              properties:
                target_type: { $ref: '#/components/schemas/TargetType' }
                target_id: { type: string }
                parent_id: { type: string, description: Required when target_type is comment. }
                body: { type: string, maxLength: 5000 }
                captcha_token:
                  type: string
                  maxLength: 4096
                  description: |
                    Solved human verification token, when `GET /captcha/status` reports
                    `scenes.comment`. Both signed-in and anonymous writers are checked.
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /comments/{commentID}:
    patch:
      tags: [community]
      summary: Edit or moderate a comment
      description: |
        An author may change the body of their own visible comment. A moderator may
        send `status` instead: `visible` restores a hidden or pending comment, `hidden`
        removes it from public view without deleting the row. Permanent removal uses
        DELETE.
      parameters:
        - $ref: '#/components/parameters/CommentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 5000 }
                status: { type: string, enum: [visible, hidden] }
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [community]
      summary: Delete a comment
      description: Allowed for the author or a moderator. Deleting twice is not an error.
      parameters:
        - $ref: '#/components/parameters/CommentID'
      responses:
        '204':
          description: Comment soft deleted
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments/{commentID}/approve:
    post:
      tags: [community]
      summary: Approve a comment awaiting review
      description: |
        Publishes a `pending_review` comment. Moderation rights are required; a deleted
        comment cannot be approved. The decision is audited. A no-op when the comment is
        already visible.
      parameters:
        - $ref: '#/components/parameters/CommentID'
      responses:
        '200':
          description: Comment approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments/{commentID}/reject:
    post:
      tags: [community]
      summary: Reject a comment awaiting review
      description: |
        Hides a `pending_review` comment without deleting it, so the body stays as
        evidence and the decision remains reversible. Moderation rights are required.
      parameters:
        - $ref: '#/components/parameters/CommentID'
      responses:
        '200':
          description: Comment rejected (hidden)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /reactions/{targetType}/{targetID}:
    post:
      tags: [community]
      summary: Toggle a reaction
      description: |
        Idempotent. With `active` omitted the current state flips; with `active` set the
        call is a no-op when the state already matches, so a retried like produces one
        write and one notification.
      parameters:
        - $ref: '#/components/parameters/TargetType'
        - $ref: '#/components/parameters/TargetID'
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [like, love, insightful]
            default: like
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleInput' }
      responses:
        '200':
          description: Resulting state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToggleResult' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /bookmarks/{targetType}/{targetID}:
    post:
      tags: [community]
      summary: Toggle a bookmark
      parameters:
        - $ref: '#/components/parameters/TargetType'
        - $ref: '#/components/parameters/TargetID'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleInput' }
      responses:
        '200':
          description: Resulting state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToggleResult' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /follows/{userID}:
    post:
      tags: [community]
      summary: Toggle following a user
      description: Following yourself is refused.
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleInput' }
      responses:
        '200':
          description: Resulting state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToggleResult' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /interactions/state:
    get:
      tags: [community]
      summary: Read the caller's state for one interaction target
      description: |
        Returns whether the caller liked or bookmarked the target and whether the
        caller follows the author. An anonymous caller on a public site receives the
        all-false state instead of 401, so the public content page can render its
        buttons before login. The content page must use this endpoint instead of
        assuming an untouched state: a toggle without `active` flips the stored row,
        so a client that renders `false` for an already-liked item would unlike it.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: target_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TargetType' }
        - name: target_id
          in: query
          required: true
          schema: { type: string }
        - name: author_id
          in: query
          required: false
          description: The content author, so `following` can be answered for content targets.
          schema: { type: string }
      responses:
        '200':
          description: The caller's state
          content:
            application/json:
              schema:
                type: object
                required: [liked, bookmarked, following]
                properties:
                  liked: { type: boolean }
                  bookmarked: { type: boolean }
                  following: { type: boolean }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /interactions/states:
    get:
      tags: [community]
      summary: Read the caller's state for a batch of targets
      description: |
        The batch form of `GET /interactions/state`, used by archive grids so one
        page does not issue one request per card. `target_ids` and `author_ids` are
        comma separated; at most 100 ids are accepted per list. Anonymous callers
        receive the requested ids with every flag false.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: target_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TargetType' }
        - name: target_ids
          in: query
          required: false
          description: Comma separated target ids (max 100).
          schema: { type: string }
        - name: author_ids
          in: query
          required: false
          description: Comma separated author ids whose follow state is requested (max 100).
          schema: { type: string }
      responses:
        '200':
          description: Per-target and per-author state
          content:
            application/json:
              schema:
                type: object
                required: [items, follows]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [target_id, liked, bookmarked]
                      properties:
                        target_id: { type: string }
                        liked: { type: boolean }
                        bookmarked: { type: boolean }
                  follows:
                    type: array
                    items:
                      type: object
                      required: [user_id, following]
                      properties:
                        user_id: { type: string }
                        following: { type: boolean }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/bookmarks:
    get:
      tags: [community]
      summary: List the caller's bookmarks
      description: |
        Newest first. Only the caller's own bookmarks are returned; the query string
        can narrow by `target_type` but never chooses whose list is read. Entries
        carry a small content read model so the page can render without N+1 requests;
        `available` is false when the target was archived or deleted.
      parameters:
        - name: target_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TargetType' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of saved interactions
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InteractionEntry' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/likes:
    get:
      tags: [community]
      summary: List the content the caller liked
      description: |
        Newest first. The default `kind` is `like`; `love` and `insightful` can be
        requested explicitly. Only the caller's own reactions are returned.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [like, love, insightful]
            default: like
        - name: target_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TargetType' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of liked content
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InteractionEntry' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/reading-history:
    get:
      tags: [community]
      summary: List the caller's reading history
      description: |
        One row per user and content target, newest visit first. The write path
        upserts on `(user, target_type, target_id)`, so reloading an item moves it
        to the top instead of creating another row; `view_count` preserves how often
        it was opened.
      parameters:
        - name: target_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TargetType' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of reading history
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReadingHistoryEntry' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [community]
      summary: Record one reading history visit
      description: |
        Requires a session. The target must be a published article or post; an
        archived or missing target answers 404. A repeated visit updates the
        timestamp and increments the counter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type:
                  type: string
                  enum: [article, post]
                target_id: { type: string }
      responses:
        '204':
          description: Visit recorded
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/following:
    get:
      tags: [community]
      summary: List the members the caller follows
      description: Newest first. Only active members of the caller's site are listed.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of followed members
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FollowEntry' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/followers:
    get:
      tags: [community]
      summary: List the members who follow the caller
      description: Newest first. Only active members of the caller's site are listed.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of followers
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FollowEntry' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /reports:
    post:
      tags: [moderation]
      summary: Report content or an account
      description: |
        Requires a session. `target_type` is one of article, post, comment or user and
        the target must exist on the caller's site; reporting your own content is
        refused. The same reporter may keep at most one open report per target: a
        repeated filing answers `409 duplicate_report`. Filing is also rate limited per
        reporter (in process, ten per hour by default) and answers `429` past the budget.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '201':
          description: Report filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [moderation]
      summary: List the open report queue
      description: |
        Oldest first. Requires editor authority or above. Closed reports are excluded;
        both `open` and `assigned` remain in the queue.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Open reports of the caller's site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /reports/{reportID}/assign:
    post:
      tags: [moderation]
      summary: Claim a report
      description: |
        Assigns the report to the caller. Only its assignee may resolve it afterwards;
        a platform administrator may also close an unassigned report.
      security:
        - bearerAuth: []
      parameters:
        - name: reportID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Report assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /reports/{reportID}/resolve:
    post:
      tags: [moderation]
      summary: Resolve a report
      description: |
        Applies the action to the target, closes the report and writes an audit entry in
        the same transaction. `ignore` dismisses the report; `takedown` archives an
        article/post or hides a comment; `ban` suspends the reported account and needs a
        site administrator. The reporter and the affected author receive a
        `moderation.updated` inbox notification. When the target action fails the report
        stays open so the moderator can retry.
      security:
        - bearerAuth: []
      parameters:
        - name: reportID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveReportInput' }
      responses:
        '200':
          description: Report resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /media:
    get:
      tags: [media]
      summary: List the site's media assets
      description: |
        Newest first, scoped to the caller's site: the token's site is the only tenant
        boundary, so no parameter widens the listing to another site.
        `purpose` and `scan_status` are applied before the page size, so `has_more` and
        `next_cursor` describe the filtered result rather than the whole library.
        Every scan verdict is listed, including `rejected`, because the library has to
        show what happened to an upload; only `clean` assets are downloadable or
        referenceable, which the download route enforces.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/ScanStatus'
      responses:
        '200':
          description: One page of assets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAssetPage' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /media/uploads:
    post:
      tags: [media]
      summary: Open an upload session
      description: |
        Phase one of the two phase upload. The declared name and MIME are claims only;
        the storage key is generated server side and never contains the user's path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, mime_type, size, purpose]
              properties:
                file_name: { type: string, maxLength: 200 }
                mime_type:
                  type: string
                  enum: [image/png, image/jpeg, image/webp, image/gif, application/pdf, text/plain]
                size: { type: integer, format: int64, minimum: 1 }
                purpose:
                  type: string
                  enum: [content, site, avatar, attachment]
                  description: |
                    What the file will be used for. `site` covers site level pictures
                    (logos, favicons, share images) and is validated like an image.
      responses:
        '201':
          description: Upload session opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /media/{assetID}:
    get:
      tags: [media]
      summary: Download a clean asset
      security: []
      description: |
        Only assets that passed inspection are reachable. A rejected object is answered
        as not found, because confirming its existence is already a disclosure. The
        response type comes from the stored asset and `nosniff` is always set.
      parameters:
        - name: assetID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The stored object
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string, format: binary } }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [media]
      summary: Delete an asset
      description: |
        Beta 1.2. Removes the stored object, every resized variant and the database row.
        Only the uploader, or a site administrator, may delete an asset. An asset that
        is still referenced by content is refused with 409 so a published page cannot
        lose its images behind the author's back.
      parameters:
        - name: assetID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /media/uploads/{uploadID}/content:
    post:
      tags: [media]
      summary: Upload the bytes for a session
      description: |
        Phase two of the flow: the declared size is a hard bound, so a short stream is
        an error rather than a truncated object. The bytes are stored under the
        server generated key and are only inspected at completion.
      parameters:
        - name: uploadID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Bytes stored and waiting for inspection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: No storage adapter is configured
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /media/uploads/{uploadID}/complete:
    post:
      tags: [media]
      summary: Complete an upload
      description: |
        Phase two: the stored object is inspected. Only a `clean` verdict yields a
        referenceable asset. A rejected file returns 422 with the asset recorded for the
        audit trail; an inspection outage returns 503 and leaves the session pending.
      parameters:
        - name: uploadID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Asset accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The file was rejected by inspection
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Asset' }
        '503':
          $ref: '#/components/responses/SecurityUnavailable'

  /conversations:
    get:
      tags: [messaging]
      summary: List the caller's conversations
      responses:
        '200':
          description: Conversations the caller belongs to
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [messaging]
      summary: Start a conversation
      description: The caller is always a member. A direct thread requires exactly one other member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                kind: { type: string, enum: [direct, group], default: direct }
                members:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 99
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /conversations/{conversationID}/messages:
    get:
      tags: [messaging]
      summary: List messages
      description: Members only. A non member is answered as not found so the conversation's existence does not leak.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages in creation order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [messaging]
      summary: Send a message
      parameters:
        - $ref: '#/components/parameters/ConversationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000 }
      responses:
        '201':
          description: Message stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /conversations/{conversationID}/read:
    post:
      tags: [messaging]
      summary: Advance the read cursor
      parameters:
        - $ref: '#/components/parameters/ConversationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id: { type: string }
      responses:
        '200':
          description: Whether the cursor moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  advanced: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications:
    get:
      tags: [notifications]
      summary: List the caller's notifications
      description: Newest first. Only the caller's own notifications are ever returned.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The inbox page with its unread count
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  unread: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark every notification read
      responses:
        '200':
          description: Number of notifications that changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications/{notificationID}/read:
    post:
      tags: [notifications]
      summary: Mark one notification read
      description: Retrying is safe; the first read timestamp is the one that counts.
      parameters:
        - name: notificationID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The notification after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/preferences:
    get:
      tags: [notifications]
      summary: Read the caller's notification settings
      description: |
        A member who never saved settings receives the defaults: in-app delivery on
        for every category, email off. `email_configured` reports whether this
        deployment has an SMTP relay at all.
      responses:
        '200':
          description: The caller's settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [notifications]
      summary: Replace the caller's notification settings
      description: |
        Replaces both channels wholesale. The in-app and email switches are
        independent: muting a category in the inbox does not mute its email, and
        vice versa. Email is only sent when SMTP is configured and the member's
        address exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: The settings after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/ws-ticket:
    post:
      tags: [events]
      summary: Mint a one time WebSocket ticket
      description: |
        The ticket is the credential for the socket, which is what lets a browser connect
        without putting an access token in a URL that ends up in logs and history. It is
        valid for 60 seconds and is redeemed exactly once.
      responses:
        '200':
          description: A ticket and the URL to connect to
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_at, url]
                properties:
                  ticket: { type: string }
                  expires_at: { type: string, format: date-time }
                  url: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /ws:
    get:
      tags: [events]
      summary: Live event stream
      description: |
        Upgrades to a WebSocket after redeeming the `ticket` query parameter. Delivery is
        best effort; after a reconnect the client catches up through `GET /events`.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        '101':
          description: Switching protocols
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /events:
    get:
      tags: [events]
      summary: Catch up on missed events
      description: |
        The authoritative recovery path after a reconnect; live WebSocket delivery is
        best effort. Only events published to this site are returned, and an event
        addressed to a specific user is returned only to that user.
      parameters:
        - name: after_id
          in: query
          required: false
          description: Last event id the client has processed. Results resume strictly after it.
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of events
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /analytics/visits:
    post:
      tags: [analytics]
      summary: Record a page view
      description: |
        Anonymous write. The site comes from the request host, never from the body, so a
        browser cannot attribute traffic to another tenant. Admin surface traffic is
        recorded but excluded from the public report.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, session, surface]
              properties:
                path: { type: string, maxLength: 2048, pattern: '^/' }
                title: { type: string, maxLength: 300 }
                referrer: { type: string, maxLength: 2048 }
                session: { type: string, maxLength: 64 }
                surface: { type: string, enum: [site, admin] }
      responses:
        '204':
          description: Page view recorded
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/analytics:
    get:
      tags: [analytics]
      summary: Traffic report for a site
      description: |
        Requires a session and at least site administrator authority. The principal's
        site must equal `siteID`; a platform administrator is allowed. Only public
        (`site`) traffic is counted. Timestamps are stored in UTC; bucket boundaries and
        labels honor `tz_offset`. `online` counts distinct sessions seen in the last five
        minutes.
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
        - name: tz_offset
          in: query
          required: false
          description: |
            Browser UTC offset in minutes east of UTC (for example 480 for UTC+8).
            Buckets and labels are aligned to this offset; stored timestamps remain UTC.
          schema: { type: integer, minimum: -840, maximum: 840, default: 0 }
      responses:
        '200':
          description: The dashboard report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsReport' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /sites/{siteID}/taxonomy:
    get:
      tags: [taxonomy]
      summary: List categories and tags
      description: |
        Anonymous read: public pages render category navigation and tag chips. The
        request host must resolve to `siteID`, so the path cannot select another
        tenant's taxonomy.
      security: []
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Categories and tags of the site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxonomy' }
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [taxonomy]
      summary: Create a category or tag
      description: Requires site administrator authority on the caller's own site.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyTermInput' }
      responses:
        '201':
          description: Term created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyTerm' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{siteID}/taxonomy/{termID}:
    patch:
      tags: [taxonomy]
      summary: Update a category or tag
      description: |
        Partial update; omitted fields are unchanged. Requires site administrator
        authority on the caller's own site. The kind is immutable.
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: termID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyTermUpdate' }
      responses:
        '200':
          description: The updated term
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyTerm' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [taxonomy]
      summary: Delete a category or tag
      description: |
        Requires site administrator authority. Deleting a category clears the category
        reference of its content instead of deleting the content.
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: termID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Term deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/metrics:
    get:
      tags: [system]
      summary: Read live resource usage of the host and this installation
      description: |
        Optional deployment level module; the backend of the admin performance panel.
        It reports host CPU, memory and disk usage, the processes that belong to this
        installation, and the rest of the machine. Requires a platform administrator
        seat, because the payload names host paths and processes. A deployment that
        disables the module (`PP_SYSTEM_METRICS=off`) does not register this route at
        all, which is how the panel is removed without touching the API contract.
      responses:
        '200':
          description: Latest cached sample
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMetrics' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /system/effective-config:
    get:
      tags: [system]
      summary: Read the deployment configuration this process is actually running with
      description: |
        Beta 1.2. The storage strategy and the access/domain panels in the dashboard
        record deployment *intent*; this endpoint reports the values the running process
        actually read from its environment, so an operator can tell whether a change has
        taken effect. It is aimed at a site administrator rather than a platform
        administrator, because these are the settings a site owner edits. No secret is
        ever included: S3 keys and SMTP passwords are absent by construction.
      responses:
        '200':
          description: The effective configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveConfig' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '500':
          description: |
            The handler was mounted without a deployment configuration source. This
            fails closed instead of reporting an empty snapshot that would look like
            "nothing is configured".

  /extensions:
    get:
      tags: [extensions]
      summary: List installed extensions
      description: |
        Requires a platform administrator seat. The catalogue is deployment scoped:
        it merges the packages on disk with the live plugin host, so a package that
        failed to load is still listed with its `last_error` instead of disappearing.
        A new package starts enabled; an upgrade keeps the previous enable state.
      responses:
        '200':
          description: Installed extensions in installation order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Extension' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /extensions/import:
    post:
      tags: [extensions]
      summary: Import an extension package
      description: |
        Requires a platform administrator seat. Accepts a zip whose root contains
        `plugin.json`; the package may carry a browser half, a Go/WASM backend, or
        both. The server rejects path traversal, absolute paths, symbolic links,
        Windows reserved names, more than 200 files and more than 64 MiB of
        unpacked data. The upload itself is bounded at 32 MiB. A new extension
        starts enabled; upgrading an existing id keeps its current enable state.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  format: binary
                  description: The zip extension package. `file` is accepted as an alias.
      responses:
        '201':
          description: Extension installed
          content:
            application/json:
              schema:
                type: object
                required: [extension]
                properties:
                  extension: { $ref: '#/components/schemas/Extension' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /extensions/{extensionID}:
    patch:
      tags: [extensions]
      summary: Enable or disable an extension
      description: |
        Requires a platform administrator seat. Takes effect on the next page load:
        the browser boot manifest is served by the plugin host, not by this endpoint.
      parameters:
        - $ref: '#/components/parameters/ExtensionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated extension
          content:
            application/json:
              schema:
                type: object
                required: [extension]
                properties:
                  extension: { $ref: '#/components/schemas/Extension' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [extensions]
      summary: Delete an extension
      description: |
        Requires a platform administrator seat. The package directory and its
        persisted enable state are removed; a running extension is unloaded first.
      parameters:
        - $ref: '#/components/parameters/ExtensionID'
      responses:
        '204':
          description: Extension deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Beta 1.2 extension set. Grouped at the end of the path map on purpose: these
  # operations were added in one batch across several modules, and keeping them
  # together makes the contract review of that batch a single contiguous read.
  # ---------------------------------------------------------------------------

  /auth/phone/policy:
    get:
      tags: [auth]
      summary: Report whether phone sign-in is available
      description: |
        Public on purpose: a visitor's sign-in page must know whether to show the
        phone tab before it has a session. The payload carries booleans only.
      security: []
      responses:
        '200':
          description: Phone sign-in availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhonePolicy' }

  /auth/phone/codes:
    post:
      tags: [auth]
      summary: Request a short lived SMS sign-in code
      description: |
        The number is normalised, hashed and never stored in the clear. Rate limits are
        per number (5 per hour) and per source address (20 per hour); the address is
        hashed too. When SMS_DEV_MODE is on the response repeats the code, which is the
        only way a self-hosted installer without an SMS vendor can sign in at all.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { type: string, maxLength: 32 }
                purpose: { type: string, enum: [login, register], default: login }
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneCodeResult' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: No SMS sender is configured for this deployment

  /auth/phone/login:
    post:
      tags: [auth]
      summary: Sign in with an SMS code
      description: |
        Returns the same session payload as the password endpoint: the code is only a
        different way of proving the same account. An unknown number creates a member
        account when the site keeps self service sign-ups open, and is refused with
        `registration_closed` when it does not.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, maxLength: 32 }
                code: { type: string, minLength: 4, maxLength: 8 }
                display_name: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '429':
          $ref: '#/components/responses/RateLimited'

  /sites/{siteID}/activity:
    get:
      tags: [sites]
      summary: Recent operations on one site
      description: |
        The dashboard's activity feed. It is a thin projection of the audit ledger, so
        the panel and the audit page can never disagree about what happened.
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Newest operations first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SiteActivityItem' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /articles/{contentID}/diff:
    get:
      tags: [content]
      summary: Line diff between two revisions of an article
      description: |
        `from` and `to` accept a version number or `current`. Author and editors only,
        with the same non disclosure rule as the revision endpoints.
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: false
          schema: { type: string, default: current }
      responses:
        '200':
          description: The diff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDiff' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{contentID}/diff:
    get:
      tags: [content]
      summary: Line diff between two revisions of a post
      parameters:
        - $ref: '#/components/parameters/ContentID'
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: false
          schema: { type: string, default: current }
      responses:
        '200':
          description: The diff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDiff' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'

  /articles/bulk:
    post:
      tags: [content]
      summary: Apply one workflow action to many articles
      description: |
        Each id is authorised and validated on its own, so a batch is a sequence of
        independent decisions rather than one transaction: a draft the caller may not
        publish does not roll back the ones that succeeded. At most 100 ids per call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkActionRequest' }
      responses:
        '200':
          description: Per item outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkActionResult' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /posts/bulk:
    post:
      tags: [content]
      summary: Apply one workflow action to many posts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkActionRequest' }
      responses:
        '200':
          description: Per item outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkActionResult' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /articles/{contentID}/preview:
    post:
      tags: [content]
      summary: Mint a draft preview link for an article
      description: |
        The token is an HMAC over the content id and an expiry, so a preview link can be
        handed to a reviewer without giving them a session. It is scoped to one item and
        expires in 30 minutes.
      parameters:
        - $ref: '#/components/parameters/ContentID'
      responses:
        '200':
          description: Preview grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewGrant' }
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{contentID}/preview:
    post:
      tags: [content]
      summary: Mint a draft preview link for a post
      parameters:
        - $ref: '#/components/parameters/ContentID'
      responses:
        '200':
          description: Preview grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewGrant' }
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /resolve:
    get:
      tags: [sites]
      summary: Resolve a public path to its canonical URL
      description: |
        The static server calls this before serving a page: an id style URL is answered
        with its slug form and a 301 so the canonical URL wins, a hit in the redirect
        table answers with the rule, and an unknown path answers 404. It is public and
        cached for a minute, because it sits in front of every page view.
      security: []
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Resolution result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PathResolution' }

  /sites/{siteID}/redirects:
    get:
      tags: [sites]
      summary: List URL redirect rules
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: One page of rules
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RedirectRule' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [sites]
      summary: Create a redirect rule
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedirectRuleInput' }
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectRule' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{siteID}/redirects/{redirectID}:
    patch:
      tags: [sites]
      summary: Update a redirect rule
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: redirectID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedirectRuleInput' }
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectRule' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [sites]
      summary: Delete a redirect rule
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: redirectID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '404':
          $ref: '#/components/responses/NotFound'

  /system/logs:
    get:
      tags: [system]
      summary: Read the recent request log
      description: |
        A bounded in process ring buffer (500 entries) of request metadata. Bodies,
        headers, cookies and query strings are never recorded, so the panel is safe to
        expose to a site administrator.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema: { type: integer }
        - name: path
          in: query
          required: false
          schema: { type: string }
        - name: method
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Newest entries first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SystemLogEntry' }
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /system/queue:
    get:
      tags: [system]
      summary: Inspect the asynchronous queues
      description: |
        Outbox and mail backlog in one payload: an operator needs to see whether the
        worker is behind before deciding to retry anything.
      responses:
        '200':
          description: Queue status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueStatus' }
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /system/queue/retry:
    post:
      tags: [system]
      summary: Requeue failed outbox events
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                event_ids:
                  type: array
                  description: Empty means the most recent 50 failed events.
                  items: { type: string }
      responses:
        '200':
          description: Retry accepted
          content:
            application/json:
              schema:
                type: object
                required: [retried]
                properties:
                  retried: { type: integer }
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /system/backup-schedule:
    get:
      tags: [system]
      summary: Read the automatic backup schedule
      description: |
        Reports the schedule the process is actually running with, plus the artifacts it
        has produced. The schedule itself comes from the environment, like storage and
        mail, so this endpoint is read only by design.
      responses:
        '200':
          description: Schedule and recent artifacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSchedule' }
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /newsletter/subscribe:
    post:
      tags: [newsletter]
      summary: Subscribe an address to the newsletter
      description: |
        Double opt in: the address only becomes a subscriber after the link in the
        confirmation mail is opened. A repeat call for a confirmed address is a no-op
        and does not mail again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                source: { type: string, maxLength: 40 }
      responses:
        '202':
          description: Confirmation mail queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterSubscribeResult' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /newsletter/confirm:
    get:
      tags: [newsletter]
      summary: Confirm a subscription
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [confirmed] }
        '404':
          $ref: '#/components/responses/NotFound'

  /newsletter/unsubscribe:
    get:
      tags: [newsletter]
      summary: Unsubscribe
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [unsubscribed] }
        '404':
          $ref: '#/components/responses/NotFound'

  /me/newsletter:
    get:
      tags: [newsletter]
      summary: Read the signed in account's newsletter preference
      responses:
        '200':
          description: Preference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyNewsletterPreference' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [newsletter]
      summary: Change the signed in account's newsletter preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Preference after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyNewsletterPreference' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /sites/{siteID}/subscribers:
    get:
      tags: [newsletter]
      summary: List newsletter subscribers
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, confirmed, unsubscribed, bounced] }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: One page of subscribers
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Subscriber' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /sites/{siteID}/subscribers/{subscriberID}:
    delete:
      tags: [newsletter]
      summary: Remove a subscriber
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: subscriberID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/newsletter-stats:
    get:
      tags: [newsletter]
      summary: Newsletter counts for the dashboard
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterStats' }

  /sites/{siteID}/email-templates:
    get:
      tags: [newsletter]
      summary: List mail templates
      description: |
        The response merges the built in defaults with the site's overrides, so the
        editor always has something to show and never has to guess a key.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EmailTemplate' }

  /sites/{siteID}/email-templates/{key}:
    put:
      tags: [newsletter]
      summary: Save a mail template override
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailTemplateInput' }
      responses:
        '200':
          description: Saved template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplate' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [newsletter]
      summary: Drop an override and fall back to the built in default
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Override removed }
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteID}/email-logs:
    get:
      tags: [newsletter]
      summary: List outbound mail
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [queued, sent, failed, skipped] }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [system, newsletter] }
      responses:
        '200':
          description: One page of deliveries
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EmailLog' }
                  next_cursor: { type: string }
                  has_more: { type: boolean }

  /sites/{siteID}/newsletters:
    post:
      tags: [newsletter]
      summary: Mail a newsletter to every confirmed subscriber
      description: |
        Queues one delivery per confirmed subscriber and returns immediately; the
        background sender drains the queue. Nothing is sent when no SMTP relay is
        configured: the rows are recorded as skipped so the operator can see why.
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string, maxLength: 300 }
                body_html: { type: string }
                body_text: { type: string }
                content_id:
                  type: string
                  description: When set, the item's title, summary and link are rendered into the body.
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer }
        '400':
          $ref: '#/components/responses/ValidationFailed'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SiteID:
      name: siteID
      in: path
      required: true
      schema: { type: string }
    StepUpToken:
      name: X-PP-Step-Up
      in: header
      required: false
      description: |
        A grant returned by `POST /auth/step-up`, bound to the caller's account and to
        the site of the access token. The SPA stores it for the rest of the browser
        session and attaches it to high threat requests; verifying once is enough for
        repeated actions in that session. Required only while the site has high threat
        operation protection enabled; a missing, expired or foreign grant then answers
        `403` with `details.reason: step_up_required`.
      schema: { type: string }
    FeedSlug:
      name: slug
      in: path
      required: true
      description: |
        Category or tag slug inside the host-resolved site. A tag slug may also be a
        free-form tag name, because the product allows tags without a taxonomy term.
      schema: { type: string }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string }
    ContentID:
      name: contentID
      in: path
      required: true
      description: |
        Beta 1.2: the identifier may be the item's id or its slug. A slug is resolved
        inside the site, so `/a/my-first-post` and `/a/<uuid>` address the same item and
        the canonical form is the slug.
      schema: { type: string }
    ExtensionID:
      name: extensionID
      in: path
      required: true
      description: Extension manifest id, for example `com.example.hello`.
      schema: { type: string }
    RevisionID:
      name: revisionID
      in: path
      required: true
      description: Identifier of one entry in the item's revision history.
      schema: { type: string }
    CommentID:
      name: commentID
      in: path
      required: true
      schema: { type: string }
    TargetType:
      name: targetType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TargetType' }
    TargetID:
      name: targetID
      in: path
      required: true
      schema: { type: string }
    ConversationID:
      name: conversationID
      in: path
      required: true
      schema: { type: string }
    OAuthProvider:
      name: provider
      in: path
      required: true
      description: |
        Third party identity provider. `google` and `github` are the ones this deployment
        implements; the list may grow, so a client should read an unknown value as "this
        provider is not offered here" and hide the button instead of treating it as a
        malformed request.
      schema: { type: string, enum: [google, github] }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page. Malformed values are rejected, never ignored.
      schema: { type: string }
    AuthorID:
      name: author_id
      in: query
      required: false
      description: |
        Restrict the page to the items of one author, which is what the archive page
        /u/{userID} uses. The id is not validated against membership: an unknown or
        malformed id simply matches nothing and yields an empty page.
      schema: { type: string }
    CategoryID:
      name: category_id
      in: query
      required: false
      description: Narrow the page to one category.
      schema: { type: string, maxLength: 36 }
    Tag:
      name: tag
      in: query
      required: false
      description: Narrow the page to items carrying this tag (exact match).
      schema: { type: string, maxLength: 40 }
    VisitSession:
      name: X-Visit-Session
      in: header
      required: false
      description: |
        The reader's anonymous browser session id, the same random value the visit
        endpoint accepts. It only de-duplicates the read counter (FSD A-16): one session
        counts at most once per item inside a 30 minute window. An absent or malformed
        value never fails the read; the server then falls back to the account or the
        client address.
      schema: { type: string, maxLength: 64 }
    Since:
      name: since
      in: query
      required: false
      description: Only items created at or after this instant (RFC 3339).
      schema: { type: string, format: date-time }
    Sort:
      name: sort
      in: query
      required: false
      description: Ordering. `newest` (default) or `oldest`.
      schema: { type: string, enum: [newest, oldest] }
    Trashed:
      name: trashed
      in: query
      required: false
      description: |
        Beta 1.2. `true` lists only the recycle bin (items whose `deleted_at` is set);
        omitted or `false` excludes trashed items, which is the behaviour every reader
        surface relies on. The trashed view requires `write_content`: a caller without
        it receives the same page it would get on a site with no trashed content.
      schema: { type: boolean }
    Purpose:
      name: purpose
      in: query
      required: false
      description: |
        Restrict the page to one purpose. A value outside the enum is rejected with 400
        instead of being ignored, so a typo cannot silently widen the listing.
      schema: { type: string, enum: [content, site, avatar, attachment] }
    ScanStatus:
      name: scan_status
      in: query
      required: false
      description: |
        Restrict the page to one inspection verdict. Rejected assets are listed like any
        other because the library has to show what happened to an upload; only `clean`
        assets are downloadable.
      schema: { type: string, enum: [pending, clean, rejected, needs_manual_review] }

  responses:
    ValidationFailed:
      description: The request body or parameters failed validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Missing, expired or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PermissionDenied:
      description: The caller is authenticated but not allowed, or not a member of the site
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: The resource does not exist in the resolved site
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The resource already exists or conflicts with current state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ContentStateInvalid:
      description: The requested workflow move is not available from the current state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SecurityUnavailable:
      description: The security service could not run, so the operation was held rather than allowed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EmailNotConfigured:
      description: The deployment has no SMTP relay, so no message can be delivered
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Too many requests, either from the engine's limiter or from this endpoint's cooldown
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, message, details, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - validation_failed
            - unauthenticated
            - permission_denied
            - not_found
            - conflict
            - rate_limited
            - internal
            - invalid_cursor
            - idempotency_key_reuse
            - site_not_found
            - site_domain_unverified
            - content_state_invalid
            - content_version_conflict
            - security_unavailable
            - provider_not_configured
            - invalid_database_driver
            - email_not_configured
            - quota_exceeded
        message: { type: string, description: Localised, may change. Clients branch on `code`. }
        details:
          type: object
          additionalProperties: true
          description: |
            Structured, non sensitive context for the failure. Always contains `reason`
            on `validation_failed`; that text is english and meant for operators, so
            clients must not display it.
            On `validation_failed` the object optionally also carries the machine
            readable vocabulary documented below, so a client can translate the failure
            instead of showing the generic message. Both keys are omitted together when
            the failing input cannot be identified (for example a malformed JSON body).
          properties:
            field:
              type: string
              description: |
                The input that failed validation. Omitted when it cannot be identified.
              enum: [email, password, current_password, new_password, display_name, bio, avatar_media_id, name, message, title, summary, slug, body, tags, role, domain, document, target, depth, color, file, limit, range, token, from, to]
            rule:
              type: string
              description: |
                The rule the input broke. Omitted when it cannot be identified.
              enum: [required, malformed, too_short, too_long, too_weak, too_common, blank, out_of_range, unknown, too_large, unsupported]
            reason:
              type: string
              description: Free english detail for operators. Never shown to an end user.
        request_id: { type: string }

    Role:
      type: string
      enum: [platform_admin, site_admin, editor, member]

    VisibilityMode:
      type: string
      enum: [public, members_only]

    PublishMode:
      type: string
      enum: [open, review, role_based]

    TargetType:
      type: string
      enum: [article, post, comment, user, page]

    InteractionEntry:
      type: object
      description: |
        One saved or liked target. The title, kind and author fields are a read model
        joined from the content table; they are empty when the target no longer
        exists, and `available` is false unless it is still published.
      required: [target_type, target_id, created_at, available]
      properties:
        target_type: { $ref: '#/components/schemas/TargetType' }
        target_id: { type: string }
        created_at: { type: string, format: date-time }
        title: { type: string }
        summary: { type: string }
        kind: { type: string }
        author_id: { type: string }
        author_name: { type: string }
        published_at: { type: string, format: date-time }
        available: { type: boolean }

    ReadingHistoryEntry:
      type: object
      description: |
        One `(user, target)` reading history row. `last_viewed_at` moves forward on
        every visit, so the list is ordered by it; `view_count` counts the opens.
      required: [target_type, target_id, last_viewed_at, view_count, available]
      properties:
        target_type: { $ref: '#/components/schemas/TargetType' }
        target_id: { type: string }
        last_viewed_at: { type: string, format: date-time }
        view_count: { type: integer }
        title: { type: string }
        summary: { type: string }
        kind: { type: string }
        author_id: { type: string }
        author_name: { type: string }
        published_at: { type: string, format: date-time }
        available: { type: boolean }

    FollowEntry:
      type: object
      description: One active member in a following or followers list.
      required: [user_id, display_name, since]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        bio: { type: string }
        avatar_media_id: { type: string }
        since: { type: string, format: date-time }

    ReportTargetType:
      type: string
      enum: [article, post, comment, user]

    ReportReason:
      type: string
      enum: [spam, abuse, illegal, other]

    ReportStatus:
      type: string
      enum: [open, assigned, resolved, dismissed]

    ReportAction:
      type: string
      enum: [ignore, takedown, ban]

    ReportInput:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type: { $ref: '#/components/schemas/ReportTargetType' }
        target_id: { type: string, maxLength: 36 }
        reason: { $ref: '#/components/schemas/ReportReason' }
        note:
          type: string
          maxLength: 2000
          description: Free text explanation shown to the moderator.

    Report:
      type: object
      required: [id, reporter_id, target_type, target_id, reason, status, created_at, updated_at]
      properties:
        id: { type: string }
        reporter_id: { type: string }
        target_type: { $ref: '#/components/schemas/ReportTargetType' }
        target_id: { type: string }
        reason: { $ref: '#/components/schemas/ReportReason' }
        note: { type: string }
        status: { $ref: '#/components/schemas/ReportStatus' }
        assignee_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Report' }

    ResolveReportInput:
      type: object
      properties:
        action:
          allOf:
            - $ref: '#/components/schemas/ReportAction'
          default: ignore
        note:
          type: string
          maxLength: 2000

    User:
      type: object
      required: [id, display_name, email_verified, locale, status, created_at]
      properties:
        id: { type: string }
        display_name: { type: string }
        email: { type: string, description: The caller's own email address; omitted from public profiles. }
        email_verified: { type: boolean, description: True once the email identity has proved ownership. }
        bio: { type: string, maxLength: 2000 }
        avatar_media_id: { type: string, description: Media asset id of the profile image, when set. }
        locale: { type: string }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }

    PublicUser:
      type: object
      description: |
        Public author archive profile. It deliberately omits the email and the
        membership status, which belong to administration rather than to /u/{userID}.
      required: [user_id, display_name, role, created_at]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        bio: { type: string, maxLength: 2000 }
        avatar_media_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }

    AuditLog:
      type: object
      description: |
        One row of `audit_logs`. `actor_name` and `target_name` are resolved display
        names and may be empty when the referenced row was deleted.
      required: [id, action, outcome, created_at]
      properties:
        id: { type: string }
        site_id: { type: string }
        actor_id: { type: string }
        actor_name: { type: string }
        action: { type: string, maxLength: 120 }
        target_type: { type: string, maxLength: 40 }
        target_id: { type: string }
        target_name: { type: string }
        request_id: { type: string }
        outcome: { type: string, example: success }
        detail:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    AuditLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        next_cursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.

    Session:
      type: object
      required: [user, token_type, access_token, access_expires_at, refresh_expires_at, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token_type: { type: string, const: Bearer }
        access_token: { type: string, description: Ed25519 signed JWT, 15 minutes. Never returned in a cookie. }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
        csrf_token: { type: string, description: Must be echoed in X-CSRF-Token when refreshing. }

    TwoFactorChallenge:
      type: object
      description: |
        Returned instead of a Session when a correct password belongs to an account
        with TOTP enabled. It carries no role claim, is not an access token and is
        single use; redeem it with `POST /auth/login/2fa`.
      required: [two_factor_required, challenge_token, expires_in, expires_at]
      properties:
        two_factor_required: { type: boolean, const: true }
        challenge_token: { type: string }
        expires_in: { type: integer, description: Challenge lifetime in seconds (300). }
        expires_at: { type: string, format: date-time }

    StepUpSettings:
      type: object
      description: |
        The masked high threat operation protection of one site. The dedicated
        security password is never returned, only whether one exists.
      required: [enabled, password_set, window_seconds]
      properties:
        enabled:
          type: boolean
          description: Whether the protected high threat routes require a fresh password proof.
        password_set:
          type: boolean
          description: Whether a dedicated security password exists (the hash is never returned).
        window_seconds:
          type: integer
          description: |
            Server-side hard cap for a minted X-PP-Step-Up grant, in seconds. The
            effective scope is one browser session (sessionStorage), which is normally
            much shorter; this value is the backstop for a grant that outlives the tab.

    StepUpSettingsUpdate:
      type: object
      properties:
        enabled:
          type: boolean
          description: Omitted means unchanged.
        password:
          type: string
          maxLength: 128
          description: |
            Sets a dedicated security password (Argon2id hashed at rest). Omitted means
            unchanged; an empty string is refused. Mutually exclusive with
            `clear_password`.
        clear_password:
          type: boolean
          description: Removes the dedicated security password so account login passwords authorize step-ups again.

    StepUpGrant:
      type: object
      description: |
        A stateless grant for the high threat operations. It is bound to the calling
        account and site and is not an access token. The SPA keeps it in sessionStorage
        for the rest of the browser session (never localStorage), so repeated actions in
        one session verify once and closing the browser clears it.
      required: [token, expires_in]
      properties:
        token: { type: string, description: Value for the X-PP-Step-Up header. }
        expires_in:
          type: integer
          description: |
            Server-side hard cap in seconds (7 days). The SPA treats the browser session
            as the effective lifetime and also discards the grant when the account or
            site changes.

    Site:
      type: object
      required: [id, slug, name, domain, visibility_mode, publish_mode, disabled, media_quota_bytes]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        domain: { type: string }
        domain_verified:
          type: boolean
          description: True when a DNS TXT challenge has proven the primary domain.
        registration_open:
          type: boolean
          description: Whether anonymous visitors may create a member account.
        comments_enabled:
          type: boolean
          description: Whether new comment writes are accepted.
        comments_require_review:
          type: boolean
          description: Whether new comments enter the moderation queue before publication.
        media_quota_bytes:
          $ref: '#/components/schemas/MediaQuotaBytes'
        visibility_mode: { $ref: '#/components/schemas/VisibilityMode' }
        publish_mode: { $ref: '#/components/schemas/PublishMode' }
        disabled: { type: boolean }

    SafetyRateLimit:
      type: object
      required: [user_per_window, ip_per_window, window_seconds]
      properties:
        user_per_window:
          type: integer
          minimum: 0
          maximum: 1000
          description: Signed-in comments allowed per member per window; 0 disables the counter.
        ip_per_window:
          type: integer
          minimum: 0
          maximum: 10000
          description: Comments allowed per client address per window; 0 disables the counter.
        window_seconds:
          type: integer
          minimum: 5
          maximum: 86400

    SafetyRateLimitUpdate:
      type: object
      properties:
        user_per_window: { type: integer, minimum: 0, maximum: 1000 }
        ip_per_window: { type: integer, minimum: 0, maximum: 10000 }
        window_seconds: { type: integer, minimum: 5, maximum: 86400 }

    SensitiveWord:
      type: object
      required: [id, word, mode, replacement, enabled, created_at, updated_at]
      properties:
        id: { type: string }
        word:
          type: string
          description: Stored trimmed and lower-cased; matching is case-insensitive.
        mode:
          type: string
          enum: [reject, replace, review]
          description: |
            `reject` refuses the submission with `403` reason `sensitive_word`,
            `replace` rewrites the match to `replacement`, `review` stores it for a
            moderator instead of publishing it.
        replacement: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NewSensitiveWord:
      type: object
      required: [word]
      properties:
        word: { type: string, minLength: 2, maxLength: 100 }
        mode: { type: string, enum: [reject, replace, review], default: reject }
        replacement: { type: string, maxLength: 80, default: '***' }
        enabled: { type: boolean, default: true }

    SensitiveWordUpdate:
      type: object
      properties:
        mode: { type: string, enum: [reject, replace, review] }
        replacement: { type: string, maxLength: 80 }
        enabled: { type: boolean }

    SiteIPRule:
      type: object
      required: [id, kind, value, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [allow, deny] }
        value:
          type: string
          description: Single IPv4/IPv6 address or CIDR block, canonicalised on write.
        note: { type: string, maxLength: 200 }
        created_at: { type: string, format: date-time }

    NewSiteIPRule:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, enum: [allow, deny] }
        value: { type: string, maxLength: 64 }
        note: { type: string, maxLength: 200 }

    SafetyPolicy:
      type: object
      required: [rate_limit, words, ip_rules]
      properties:
        rate_limit: { $ref: '#/components/schemas/SafetyRateLimit' }
        words:
          type: array
          items: { $ref: '#/components/schemas/SensitiveWord' }
        ip_rules:
          type: array
          items: { $ref: '#/components/schemas/SiteIPRule' }

    SiteDomainStatus:
      type: object
      required: [domain, verified, verification_token, record_name, record_type]
      properties:
        domain: { type: string }
        verified: { type: boolean }
        verification_token:
          type: string
          description: TXT value to publish while pending; empty once verified.
        record_name:
          type: string
          description: DNS record name, `_practacu-verify.<domain>`.
        record_type: { type: string, enum: [TXT] }

    SiteDomainInput:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          maxLength: 253
          description: |
            Bare hostname; punycode labels are accepted. Scheme, port, path, wildcard,
            IP address and whitespace are rejected. An empty string clears the domain,
            its challenge token and its verification timestamp.

    PlatformSite:
      type: object
      description: |
        One site as the deployment console shows it. It intentionally carries the fields
        an operator compares across sites plus the two member counts, not the full site
        settings payload.
      required:
        [id, slug, name, description, domain, domain_verified, visibility_mode,
         publish_mode, disabled, member_count, admin_count, created_at, updated_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description:
          type: string
          description: Empty string when the site has no description, never omitted.
        domain: { type: string }
        domain_verified: { type: boolean }
        visibility_mode: { $ref: '#/components/schemas/VisibilityMode' }
        publish_mode: { $ref: '#/components/schemas/PublishMode' }
        disabled: { type: boolean }
        member_count:
          type: integer
          minimum: 0
          description: Memberships of the site, suspended ones included.
        admin_count:
          type: integer
          minimum: 0
          description: Active members that may administer the site.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSiteOwner:
      type: object
      description: The first administrator of a new site. Always a site administrator.
      required: [email, display_name, password]
      properties:
        email: { type: string, format: email }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            12–128 characters combining at least two character classes. Validated
            against the deployment password policy before creation; classic weak
            passwords are refused with `details.rule: too_common`.

    CreateSiteInput:
      type: object
      required: [name, slug, domain, owner]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
          description: URL friendly identifier, unique across the install.
        description:
          type: string
          maxLength: 2000
        domain:
          type: string
          maxLength: 253
          description: |
            Required primary hostname. It is stored unverified together with a DNS TXT
            challenge token, so the site starts serving only after ownership is proven.
        visibility_mode:
          allOf:
            - $ref: '#/components/schemas/VisibilityMode'
          description: Defaults to public when omitted.
        publish_mode:
          allOf:
            - $ref: '#/components/schemas/PublishMode'
          description: Defaults to review when omitted.
        owner: { $ref: '#/components/schemas/CreateSiteOwner' }

    CreatedSite:
      type: object
      required: [site, owner]
      properties:
        site: { $ref: '#/components/schemas/PlatformSite' }
        owner:
          type: object
          required: [user_id, display_name, role]
          properties:
            user_id: { type: string }
            display_name: { type: string }
            role: { $ref: '#/components/schemas/Role' }

    PlatformSiteDetail:
      type: object
      required: [site, role, domain_status]
      properties:
        site: { $ref: '#/components/schemas/PlatformSite' }
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: The caller's live role on the target site.
        domain_status:
          allOf:
            - $ref: '#/components/schemas/SiteDomainStatus'
          description: |
            The pending challenge or the verified state. A newly created site is not
            reachable on its hostname until this challenge succeeds.

    PlatformSiteEntry:
      type: object
      required: [site, role, switchable]
      description: |
        The answer to "enter this site". `switch_token` is present only when
        `switchable` is true and the target is another site.
      properties:
        site: { $ref: '#/components/schemas/PlatformSite' }
        role: { $ref: '#/components/schemas/Role' }
        switchable: { type: boolean }
        reason:
          type: string
          description: |
            Why the site cannot be entered. One of `site_disabled`, `domain_missing` or
            `domain_unverified`. Omitted when switchable is true.
        switch_token:
          type: string
          description: Short lived handoff token; redeem it on the target site's origin.
        expires_at: { type: string, format: date-time }

    SiteSwitchClaim:
      type: object
      required: [switch_token]
      properties:
        switch_token: { type: string }

    PlatformOverview:
      type: object
      description: |
        The deployment wide snapshot behind `/admin/platform`. Counters and statuses
        only: no account secret, no TOTP seed and no token ever appears in it.
      required: [generated_at, window_days, window_start, totals, signals, sites, recent_activity]
      properties:
        generated_at: { type: string, format: date-time }
        window_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Width of the activity window; 7 when the caller asks for none.
        window_start: { type: string, format: date-time }
        totals: { $ref: '#/components/schemas/PlatformOverviewTotals' }
        signals: { $ref: '#/components/schemas/PlatformOverviewSignals' }
        sites:
          type: array
          items: { $ref: '#/components/schemas/PlatformOverviewSite' }
        recent_activity:
          type: array
          description: Newest audit rows across every site inside the window.
          items: { $ref: '#/components/schemas/PlatformActivityRow' }

    PlatformOverviewTotals:
      type: object
      required:
        [sites, disabled_sites, unverified_sites, members, active_members, admins,
         content, published_content, pending_content, comments, pending_comments,
         accounts, verified_accounts, two_factor_accounts]
      properties:
        sites: { type: integer, minimum: 0 }
        disabled_sites: { type: integer, minimum: 0 }
        unverified_sites:
          type: integer
          minimum: 0
          description: Sites whose primary domain is missing or not yet proven.
        members: { type: integer, minimum: 0, description: Memberships, suspended included. }
        active_members: { type: integer, minimum: 0 }
        admins: { type: integer, minimum: 0, description: Active members that may administer. }
        content: { type: integer, minimum: 0 }
        published_content: { type: integer, minimum: 0 }
        pending_content:
          type: integer
          minimum: 0
          description: Items in review or waiting for the security check.
        comments: { type: integer, minimum: 0 }
        pending_comments: { type: integer, minimum: 0 }
        accounts: { type: integer, minimum: 0, description: Accounts of the whole install. }
        verified_accounts: { type: integer, minimum: 0 }
        two_factor_accounts:
          type: integer
          minimum: 0
          description: Accounts with a confirmed authenticator. Never the seed itself.

    PlatformOverviewSignals:
      type: object
      description: The numbers an operator looks at first; each one is actionable today.
      required:
        [open_reports, pending_comments, failed_actions, disabled_sites, unverified_sites,
         unverified_emails, quiet_sites]
      properties:
        open_reports:
          type: integer
          minimum: 0
          description: Reports still waiting for a decision (open or assigned).
        pending_comments: { type: integer, minimum: 0 }
        failed_actions:
          type: integer
          minimum: 0
          description: |
            Audit rows with outcome `failure` inside the window. Today that is the human
            verification guard; a module that records another failure outcome appears here
            automatically. Failed password attempts are throttled in memory and are not
            persisted, so they are not part of this number.
        disabled_sites: { type: integer, minimum: 0 }
        unverified_sites: { type: integer, minimum: 0 }
        unverified_emails: { type: integer, minimum: 0 }
        quiet_sites:
          type: integer
          minimum: 0
          description: Running sites that wrote no audit row inside the window.

    PlatformOverviewSite:
      type: object
      required:
        [id, slug, name, domain, domain_verified, visibility_mode, publish_mode, disabled,
         member_count, active_member_count, admin_count, content_count,
         published_content_count, pending_content_count, draft_count, comment_count,
         pending_comment_count, open_report_count, recent_activity_count,
         recent_failure_count, created_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        domain: { type: string }
        domain_verified: { type: boolean }
        visibility_mode: { $ref: '#/components/schemas/VisibilityMode' }
        publish_mode: { $ref: '#/components/schemas/PublishMode' }
        disabled: { type: boolean }
        member_count: { type: integer, minimum: 0 }
        active_member_count: { type: integer, minimum: 0 }
        admin_count: { type: integer, minimum: 0 }
        content_count: { type: integer, minimum: 0 }
        published_content_count: { type: integer, minimum: 0 }
        pending_content_count: { type: integer, minimum: 0 }
        draft_count: { type: integer, minimum: 0 }
        comment_count: { type: integer, minimum: 0 }
        pending_comment_count: { type: integer, minimum: 0 }
        open_report_count: { type: integer, minimum: 0 }
        recent_activity_count:
          type: integer
          minimum: 0
          description: Audit rows written for this site inside the window.
        recent_failure_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }

    PlatformActivityRow:
      allOf:
        - $ref: '#/components/schemas/AuditLog'
        - type: object
          description: |
            One audit row of the overview. The site label is resolved server side from the
            same counters; a row written outside any site carries an empty label.
          properties:
            site_name: { type: string }

    PlatformAccountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlatformAccount' }
        next_cursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.

    PlatformAccount:
      type: object
      description: |
        One account as the deployment directory shows it. Two factor collapses to a
        boolean and the identity password hash is never part of the payload.
      required:
        [user_id, display_name, email, email_verified, two_factor_enabled, status,
         created_at, memberships]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        email:
          type: string
          description: Address of the account's email identity; empty without one.
        email_verified: { type: boolean }
        two_factor_enabled: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/PlatformAccountMembership' }

    PlatformAccountMembership:
      type: object
      required: [site_id, site_name, site_slug, role, status]
      properties:
        site_id: { type: string }
        site_name: { type: string }
        site_slug: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, invited, suspended] }

    Member:
      type: object
      required: [user_id, display_name, role, status, media_quota_bytes, group_key, group_name]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, invited, suspended] }
        media_quota_bytes:
          $ref: '#/components/schemas/MediaQuotaBytes'
        group_key:
          type: string
          description: |
            Capability group of the membership. An unassigned member reports the
            built-in group of its role (`member`, `moderator`, `admin` or `owner`).
        group_name:
          type: string
          description: |
            Operator visible label. Empty means "use the interface language's
            built-in label", which is how a never-renamed group follows the locale.
        email:
          type: string
          format: email
          description: Login email of the account. Omitted when the account has no email identity.

    CapabilityMatrix:
      type: object
      description: |
        The full matrix of one group. Every known capability id is present; `true`
        means enabled. A capability absent from the payload is treated as disabled.
      properties:
        read_content: { type: boolean }
        comment: { type: boolean }
        write_content: { type: boolean }
        moderate_content: { type: boolean }
        moderate_comment: { type: boolean }
        manage_member: { type: boolean }
        manage_site: { type: boolean }
        view_log: { type: boolean }
        manage_permission: { type: boolean }
      additionalProperties: false

    PermissionGroup:
      type: object
      required: [key, name, base_role, capabilities, admin_access, builtin]
      properties:
        key: { type: string, maxLength: 36 }
        name:
          type: string
          maxLength: 60
          description: Empty means the built-in localized label.
        base_role:
          type: string
          description: |
            Server role the group maps to. Empty for the guest group, which has no
            account. Built-in keys never change this mapping.
        capabilities: { $ref: '#/components/schemas/CapabilityMatrix' }
        admin_access: { type: boolean }
        builtin: { type: boolean }

    PermissionGroupInput:
      type: object
      required: [name, capabilities, admin_access]
      properties:
        name: { type: string, maxLength: 60 }
        base_role:
          type: string
          enum: [member, editor, site_admin]
          description: |
            Base role of a custom group. Ignored for the built-in keys, whose role
            mapping is fixed. `platform_admin` is not accepted: only the built-in
            owner group may carry it.
        capabilities: { $ref: '#/components/schemas/CapabilityMatrix' }
        admin_access: { type: boolean }

    ChangeMemberGroup:
      type: object
      required: [group_key]
      properties:
        group_key: { type: string, maxLength: 36 }

    MediaQuotaBytes:
      type: [integer, 'null']
      format: int64
      minimum: 0
      description: |
        A non-negative byte limit. Null clears the explicit override and falls back to
        the inherited quota; zero explicitly means unlimited. Positive values are the
        maximum number of bytes.

    UpdateMember:
      type: object
      minProperties: 1
      description: Partial update; omitted fields are left unchanged.
      properties:
        display_name: { type: string, maxLength: 120 }
        email: { type: string, format: email }

    UpdateMemberStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended]

    DraftInput:
      type: object
      required: [title, source_body]
      properties:
        title: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        summary: { type: string, maxLength: 500 }
        source_format: { type: string, enum: [markdown, html, plain], default: markdown }
        source_body: { type: string, maxLength: 200000 }
        category_id: { type: string }
        tags:
          type: array
          description: Up to 12 labels, each at most 24 characters; order is preserved.
          maxItems: 12
          items: { type: string, maxLength: 24 }
        publish_at:
          type: string
          format: date-time
          description: |
            Optional scheduled publication instant, truncated to the minute (C-17).
            Only a caller that may publish directly can set it. Omit or send an empty
            value to cancel a pending schedule. A manual publish clears it.
        access_mode:
          type: string
          enum: [public, password, members]
          default: public
          description: |
            Who may read the published item (C-18). `password` requires the unlock
            endpoint, `members` requires a signed in reader. Both are direct-link-only:
            they never appear in listings, search, feeds or sitemaps.
        access_password:
          type: string
          format: password
          minLength: 4
          maxLength: 128
          description: |
            Write only. Required when switching to `password` access; an empty value on
            an update keeps the stored hash. The server stores only an Argon2id hash.
        comment_policy:
          type: string
          enum: [inherit, open, disabled, review]
          default: inherit
          description: |
            Per item override of the site comment switches (C-19). `inherit` follows
            the site, `open` allows comments, `disabled` closes the thread and `review`
            sends new comments to the moderation queue.
        seo_title:
          type: string
          maxLength: 200
          description: Beta 1.2. Per item title override; empty inherits the site template.
        seo_description: { type: string, maxLength: 500 }
        seo_keywords: { type: string, maxLength: 500 }
        canonical_url: { type: string, maxLength: 500 }
        og_image:
          type: string
          description: Social share card image; accepts a data URL.
        robots:
          type: string
          enum: ['', index, noindex]
          default: ''
          description: Empty inherits the site switch; `noindex` drops the item from the sitemap.
        cover_url:
          type: string
          description: Cover image; accepts a data URL, same rules as the appearance panel used.
        cover_alt: { type: string, maxLength: 200 }
        cover_position: { type: string, enum: [top, center, bottom], default: center }
        cover_hidden: { type: boolean, default: false }
        revision:
          type: integer
          description: |
            Beta 1.2. Optimistic concurrency token. When supplied it must match the
            stored revision of the item, otherwise the request is refused with 409
            content_version_conflict. Omit it to keep the previous last write wins
            behaviour.


    Content:
      type: object
      required: [id, kind, status, title, slug, source_format, rendered_html, policy_version, category_id, tags, view_count, created_at, updated_at, actions]
      properties:
        id: { type: string }
        kind: { type: string, enum: [article, post] }
        status:
          type: string
          enum: [draft, pending_review, published, rejected, archived, pending_security_check]
        title: { type: string }
        slug: { type: string }
        summary: { type: string }
        source_format: { type: string, enum: [markdown, html, plain] }
        source_body:
          type: string
          description: |
            The author's original text. Returned only to the item's author and to
            editors, never to an anonymous reader: clients must render
            `rendered_html`, which is the sanitized representation.
        rendered_html:
          type: string
          description: The only representation a client may render. Produced by the security service.
        policy_version: { type: string }
        author_id:
          type: string
          description: |
            Read only. The account that wrote the item. Reader surfaces resolve the
            display name from the public profile endpoint (`GET /users/{userID}`).
        revision:
          type: integer
          description: Current version number in the item's revision history.
        category_id: { type: string }
        tags:
          type: array
          description: Labels attached to the item, in author order. Empty when untagged.
          items: { type: string }
        published_at: { type: string, format: date-time }
        publish_at:
          type: string
          format: date-time
          description: Pending publication instant of a scheduled draft. Absent once published or cancelled.
        access_mode:
          type: string
          enum: [public, password, members]
          description: Who may read the published item (C-18).
        has_access_password:
          type: boolean
          description: |
            True when a password hash is stored. The hash and the plaintext are never
            returned; the reader unlocks the item through the unlock action.
        comment_policy:
          type: string
          enum: [inherit, open, disabled, review]
          description: Per item override of the site comment switches (C-19).
        view_count:
          type: integer
          minimum: 0
          description: |
            De-duplicated number of reads the server served for this published item.
            Every listing carries it, so an archive can show the number without one
            request per item. A read counts at most once per reader inside a 30 minute
            window, reads by the author and by editors never count, and the value is not
            derived from the page view ledger. The detail response reports the count
            before the read that requested it.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          description: |
            Beta 1.2. Set while the item sits in the recycle bin. An item with a value
            here is invisible to readers everywhere (listings, search, feeds, sitemaps)
            and can be brought back with the `undelete` action or destroyed with
            `purge`.
        seo_title:
          type: string
          maxLength: 200
          description: |
            Beta 1.2. Per item override of the site title template. Empty inherits the
            template, which is what every item did before this field existed.
        seo_description: { type: string, maxLength: 500 }
        seo_keywords:
          type: string
          maxLength: 500
          description: Comma separated hint list, stored verbatim and never split server side.
        canonical_url:
          type: string
          maxLength: 500
          description: Overrides the derived permalink; empty means the item's own URL is canonical.
        og_image:
          type: string
          description: |
            Social share card image. Accepts a data URL, which is why it is unbounded.
            Falls back to `cover_url` and then to the site share image.
        robots:
          type: string
          enum: ['', index, noindex]
          description: |
            Beta 1.2. Empty inherits the site indexing switch. `noindex` removes the item
            from the sitemap and marks the page noindex.
        cover_url:
          type: string
          description: |
            Beta 1.2. The cover moved from the site appearance configuration into the
            content row, so it survives export, feeds and share cards. Accepts a data URL.
        cover_alt: { type: string, maxLength: 200 }
        cover_position: { type: string, enum: [top, center, bottom] }
        cover_hidden: { type: boolean }
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Beta 1.2. Moderator-only and review-only. Rule based score computed on demand
            when a caller with moderation authority reads a pending item
            (`pending_review` or `pending_security_check`) whose `source_body` is
            available. It is never stored, and it is absent for published content, for
            readers and for the item's own author, so a client must treat it as optional.
        risk_flags:
          type: array
          description: |
            Beta 1.2. Moderator-only and review-only. Stable english identifiers behind the
            score (`links`, `very_short`, `very_long`, `repeated_chars`, `shouty`,
            `no_letters`, `repeated_text`); an empty array means "scored, nothing
            flagged". The client owns their presentation.
          items: { type: string }
        actions:
          type: array
          description: |
            Workflow actions this caller may take right now. A trashed item reports
            `undelete` and `purge` and nothing else, because every other transition
            needs a live item.
          items: { type: string, enum: [submit, publish, reject, archive, restore, unpublish, security-retry, undelete, purge] }

    ContentUnlockResult:
      type: object
      description: |
        Result of the `unlock` action. The session grant itself is delivered as an
        HttpOnly cookie so a script cannot read it; the body only confirms the grant
        and when it expires.
      required: [unlocked, expires_at]
      properties:
        unlocked: { type: boolean }
        expires_at: { type: string, format: date-time }

    ContentPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Content' }
        next_cursor: { type: string }
        has_more: { type: boolean }

    PopularContentPage:
      type: object
      description: |
        The leaderboard of `GET /content/popular`: published public items ordered by
        reads decayed by publication age (FSD A-16 / B-20).
      required: [items, window]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Content' }
        window:
          type: string
          enum: [7d, 30d, 90d]
          description: The ranking horizon the server applied.

    ContentRevisionSummary:
      type: object
      description: One entry of an item's bounded revision history (newest 20 versions).
      required: [id, content_id, version, editor_id, action, status, title, slug, source_format, tags, created_at]
      properties:
        id: { type: string }
        content_id: { type: string }
        version: { type: integer, description: Version number, starting at 1. }
        editor_id: { type: string, description: Account that wrote this version. }
        editor_name: { type: string, description: Display name of the editor, when the account still exists. }
        action:
          type: string
          enum: [created, updated, rollback_backup, rollback]
        status:
          type: string
          enum: [draft, pending_review, published, rejected, archived, pending_security_check]
        title: { type: string }
        slug: { type: string }
        summary: { type: string }
        source_format: { type: string, enum: [markdown, html, plain] }
        category_id: { type: string }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    ContentRevision:
      allOf:
        - $ref: '#/components/schemas/ContentRevisionSummary'
        - type: object
          required: [source_body, rendered_html, policy_version]
          properties:
            source_body: { type: string, description: The raw source stored for this version. }
            rendered_html: { type: string, description: Sanitized HTML produced when this version was saved. }
            policy_version: { type: string }

    ContentRevisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentRevisionSummary' }

    Comment:
      type: object
      required: [id, target_type, target_id, depth, body, status, created_at]
      properties:
        id: { type: string }
        target_type: { $ref: '#/components/schemas/TargetType' }
        target_id: { type: string }
        parent_id: { type: string }
        depth: { type: integer, description: 0 for a top level comment. }
        body: { type: string }
        status: { type: string, enum: [visible, hidden, deleted, pending_review] }
        author_id: { type: string, description: Read only. The account that wrote the comment. }
        author_name:
          type: string
          description: Read only. Display name of the author, joined for listing.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Beta 1.2. Moderator-only. Rule based score computed on the server when the
            comment is written, so the queue ranks the same way on every device and the
            value is auditable. Public comment listings never include it.
        risk_flags:
          type: array
          description: |
            Beta 1.2. Moderator-only. Stable english identifiers behind the score
            (`links`, `very_long`, `repeated_chars`, `shouty`, `no_letters`,
            `repeated_text`); the client owns their presentation.
          items: { type: string }

    CommentPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        next_cursor: { type: string }
        has_more: { type: boolean }

    NewMember:
      type: object
      required: [email, display_name, password]
      properties:
        email: { type: string, format: email }
        display_name: { type: string, maxLength: 120 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            12–128 characters combining at least two of lowercase, uppercase, digits
            and symbols; classic weak passwords are refused with
            `details.rule: too_common`.
        role:
          $ref: '#/components/schemas/Role'

    ToggleInput:
      type: object
      properties:
        active:
          type: boolean
          description: Desired state. Omit to flip the current state.

    ToggleResult:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    Upload:
      type: object
      required: [id, file_name, storage_key, status, expires_at]
      properties:
        id: { type: string }
        file_name: { type: string }
        storage_key: { type: string }
        status: { type: string, enum: [pending, uploaded, completed, expired] }
        expires_at: { type: string, format: date-time }

    Asset:
      type: object
      required: [id, storage_key, mime_type, size, scan_status, created_at, url]
      properties:
        id: { type: string }
        storage_key: { type: string }
        mime_type: { type: string }
        size: { type: integer, format: int64 }
        scan_status: { type: string, enum: [pending, clean, rejected, needs_manual_review] }
        scan_reason: { type: string }
        purpose:
          type: string
          enum: [content, site, avatar, attachment]
          description: Absent on rows that predate per purpose storage.
        created_at: { type: string, format: date-time }
        url:
          type: string
          description: Download path of this asset, for example /api/v1/media/{id}.
        file_name:
          type: string
          description: |
            Beta 1.2. The name the uploader used, captured when the upload session was
            opened. Empty on rows written before the column existed. It is display only:
            the storage key stays server derived and never takes user input.

    MediaAssetPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        next_cursor: { type: string }
        has_more: { type: boolean }

    Conversation:
      type: object
      required: [id, kind, created_by, members]
      properties:
        id: { type: string }
        kind: { type: string, enum: [direct, group] }
        created_by: { type: string }
        members:
          type: array
          items: { type: string }

    Message:
      type: object
      required: [id, conversation_id, sender_id, body, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        sender_id: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, type, payload, read, created_at]
      properties:
        id: { type: string }
        type: { type: string, description: For example comment.created or follow.created. }
        actor_id: { type: string }
        subject_id: { type: string }
        payload:
          type: object
          description: Flat string map, bounded in size; never queried.
          additionalProperties: { type: string }
        read: { type: boolean }
        read_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    NotificationChannelPreferences:
      type: object
      required: [enabled, comments, reactions, follows, moderation]
      properties:
        enabled: { type: boolean, description: Master switch for this channel. }
        comments: { type: boolean, description: Comments and replies. }
        reactions: { type: boolean, description: Likes and other reactions. }
        follows: { type: boolean, description: New followers. }
        moderation:
          type: boolean
          description: Review decisions, reports and the contact form (staff traffic).
    NotificationPreferences:
      type: object
      required: [in_app, email, email_configured]
      properties:
        in_app:
          $ref: '#/components/schemas/NotificationChannelPreferences'
        email:
          $ref: '#/components/schemas/NotificationChannelPreferences'
        email_configured:
          type: boolean
          description: Whether the deployment has an SMTP relay; false means email switches have no effect yet.
    Event:
      type: object
      required: [id, type, site_id, payload]
      properties:
        id: { type: string, description: UUIDv7, ordered by creation time. }
        type: { type: string }
        occurred_at: { type: string, format: date-time }
        site_id: { type: string }
        payload: { type: object, additionalProperties: true }

    AnalyticsTotals:
      type: object
      required: [views, sessions, online]
      properties:
        views: { type: integer, description: Page views of the public surface in the range. }
        sessions: { type: integer, description: Distinct visitor sessions in the range. }
        online: { type: integer, description: Distinct sessions seen in the last five minutes. }

    AnalyticsPoint:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
          description: Preformatted bucket label; "15:00" for hours and "10/24" for days.
        count: { type: integer }

    TopPage:
      type: object
      required: [path, count]
      properties:
        path: { type: string }
        count: { type: integer }

    TopContent:
      type: object
      required: [id, count]
      properties:
        id: { type: string, description: 'Content id parsed from /a/{id} and /p/{id} detail paths.' }
        count: { type: integer }

    RecentVisit:
      type: object
      required: [path, title, referrer, session, created_at]
      properties:
        path: { type: string }
        title: { type: string }
        referrer: { type: string }
        session: { type: string }
        created_at: { type: string, format: date-time }

    AnalyticsReport:
      type: object
      required: [range, totals, series, top_pages, top_content, recent]
      properties:
        range: { type: string, enum: [24h, 7d, 30d] }
        totals: { $ref: '#/components/schemas/AnalyticsTotals' }
        sources:
          type: array
          description: Beta 1.2. Visits grouped by the traffic source derived on write.
          items:
            type: object
            required: [source, visits, sessions]
            properties:
              source: { type: string, enum: [direct, search, social, referral, internal, unknown] }
              visits: { type: integer }
              sessions: { type: integer }
        devices:
          type: array
          description: Beta 1.2. Visits grouped by the coarse device class derived on write.
          items:
            type: object
            required: [device, visits, sessions]
            properties:
              device: { type: string, enum: [desktop, mobile, tablet, bot, unknown] }
              visits: { type: integer }
              sessions: { type: integer }
        top_referrers:
          type: array
          description: Beta 1.2. External hosts that sent the most visits.
          items:
            type: object
            required: [host, visits]
            properties:
              host: { type: string }
              visits: { type: integer }
        retention:
          type: array
          description: |
            Beta 1.2. Per day new versus returning sessions. A session is new on the day
            it first appears and returning on every later day it is seen again.
          items:
            type: object
            required: [date, new_sessions, returning_sessions]
            properties:
              date: { type: string }
              new_sessions: { type: integer }
              returning_sessions: { type: integer }
        series:
          type: array
          description: 24 hourly buckets for 24h, 7 or 30 daily buckets otherwise, aligned to tz_offset.
          items: { $ref: '#/components/schemas/AnalyticsPoint' }
        top_pages:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/TopPage' }
        top_content:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/TopContent' }
        recent:
          type: array
          maxItems: 10
          description: Latest public page views of the report window, newest first.
          items: { $ref: '#/components/schemas/RecentVisit' }

    TaxonomyTerm:
      type: object
      required: [id, kind, name, slug, description, color]
      properties:
        id: { type: string }
        kind: { type: string, enum: [category, tag] }
        name: { type: string, maxLength: 80 }
        slug: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        color: { type: string, description: '#rrggbb; empty for tags that have no colour.' }

    Taxonomy:
      type: object
      required: [categories, tags]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/TaxonomyTerm' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TaxonomyTerm' }

    TaxonomyTermInput:
      type: object
      required: [kind, name, slug]
      properties:
        kind: { type: string, enum: [category, tag] }
        name: { type: string, maxLength: 80 }
        slug:
          type: string
          maxLength: 80
          description: Lowercase ASCII slug, unique per kind inside the site.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: { type: string, maxLength: 500 }
        color: { type: string, description: '#rrggbb; optional.' }

    TaxonomyTermUpdate:
      type: object
      description: Partial update; omitted fields are unchanged. The kind cannot change.
      properties:
        name: { type: string, maxLength: 80 }
        slug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: { type: string, maxLength: 500 }
        color: { type: string, description: '#rrggbb; send an empty string to clear.' }

    ContactMessageInput:
      type: object
      description: |
        One anonymous message from the contact form block. `name` and `email` are
        optional because the block can hide either field; the server therefore never
        requires them, and an empty value is simply left out of the notification.
      required: [message]
      properties:
        name:
          type: string
          maxLength: 80
          description: Display name of the sender, bounded in UTF-8 bytes.
        email:
          type: string
          maxLength: 200
          description: |
            Reply address, bounded in UTF-8 bytes. The only rule is that it contains an
            `@`; the server does not try to prove deliverability.
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            The message itself, at most 2000 characters. Stored and rendered as plain
            text: it is never interpreted as HTML.
        website:
          type: string
          description: |
            Honeypot. The rendered form keeps this field hidden, so a real visitor leaves
            it empty. Any non-empty value answers `202` and delivers nothing.

    ContactMessageAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: accepted

    SiteCustomization:
      type: object
      description: |
        The opaque design document of a site plus the revision it is at. `revision`
        increments on every accepted write and is the value to send back when saving.
      required: [site_id, revision, updated_at, customization]
      properties:
        site_id: { type: string }
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
        customization:
          type: object
          additionalProperties: true
          description: |
            The frontend's design object: theme tokens, layout variant, page tree,
            cover and pin lists. The server never interprets it.

    SiteCustomizationInput:
      type: object
      required: [customization]
      properties:
        customization:
          type: object
          additionalProperties: true
        revision:
          type: integer
          minimum: 0
          description: |
            The revision the client last read. Omit it for an unconditional write. A
            value that no longer matches the stored revision is refused with `409`.

    SiteCustomizationSaved:
      type: object
      required: [revision, updated_at]
      properties:
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }

    SiteConfig:
      type: object
      description: |
        The site runtime configuration plus the revision it is at. `scope` says which
        projection the caller received: `admin` is the whole document, `public` is the
        anonymous subset the visitor's browser executes.
      required: [site_id, revision, updated_at, scope, config]
      properties:
        site_id: { type: string }
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
        scope:
          type: string
          enum: [admin, public]
        config:
          $ref: '#/components/schemas/SiteConfigDocument'

    SiteConfigDocument:
      type: object
      additionalProperties: true
      description: |
        The stored document. Unknown sections are ignored by the normalisers, so the
        document can grow without an API change. The public projection keeps only the
        browser-executed fields of `domains`, `performance` and `auth` (the switch, not
        the provider parameters).
      properties:
        admin_path:
          type: string
          maxLength: 80
          description: |
            Where the admin SPA is mounted, for example `/manage`. Must start with `/`,
            must not shadow a site route (`/login`, `/setup`, `/api`, `/articles`,
            `/me`, …) and is validated on write.
        access:
          type: object
          description: |
            Browser-enforced access limits. Public. `page_switch` and `requests` are
            sliding windows (`limit` per `window_seconds`, blocked for `block_seconds`);
            `tabs` bounds how many site tabs one browser may keep open. Admin, setup
            and preview frames are always exempt so the owner cannot lock themselves
            out. This is not a substitute for the gateway: direct API traffic is only
            limited by `RATE_LIMIT_PER_MINUTE` / Nginx.
          additionalProperties: true
        domains:
          type: object
          description: |
            Bound domains. Public fields: `enabled`, `primary`, `aliases`,
            `allow_www`, `allow_localhost`, `allow_ip`. Administrator-only fields:
            `redirect_primary`, `https_only`, `tls`, `cors_origins`, `cookie_domain`,
            `trusted_proxies`.
          additionalProperties: true
        performance:
          type: object
          description: |
            Public fields are the ones a browser executes: `feed_limit`,
            `archive_limit`, `request_cache`, `cache_ttl`, `lazy_media`,
            `disable_animations`, `preconnect`. The gateway, API and database tuning
            fields (`gzip`, `static_cache_days`, `*_timeout`, `client_max_body_size_mb`,
            `db_*`) are administrator-only deployment intent: they are rendered into a
            copy-paste `.env` / Nginx snippet and never change by themselves.
          additionalProperties: true
        loading:
          type: object
          description: |
            The frontend loading screen. Public: `enabled`, `preset`, `text`,
            `accent_mode`, `accent`, `background_mode`, `background`, `size`,
            `min_duration_ms`, `show_on_first_load`, `show_on_navigation`,
            `custom_css`. `custom_css` gets the same dangerous-construct check as the
            design document's custom CSS (no `@import`, no `expression(`, no
            `url(javascript:)`).
          additionalProperties: true
        auth:
          type: object
          description: |
            Public: `enabled` per provider id, because the login page draws a button per
            enabled provider. Administrator-only: `client_id`, `redirect_uri`, `extra`
            and `note` — which non-email login providers the owner intends to enable,
            with their non-secret parameters. Secrets are never stored; the page renders
            a server `.env` snippet instead. The API does not implement these providers.
          additionalProperties: true

    SiteConfigInput:
      type: object
      required: [config]
      properties:
        config:
          $ref: '#/components/schemas/SiteConfigDocument'
        revision:
          type: integer
          minimum: 0
          description: |
            The revision the client last read. Omit it for an unconditional write. A
            value that no longer matches the stored revision is refused with `409`
            and `details.reason = config_revision_conflict`.

    SiteConfigSaved:
      type: object
      required: [revision, updated_at]
      properties:
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }

    BackupArtifact:
      type: object
      description: One stored backup package.
      required: [id, file_name, size, sha256, created_at, driver, dialect, includes_media]
      properties:
        id: { type: string }
        file_name: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, description: SHA-256 of the zip file itself }
        created_at: { type: string, format: date-time }
        driver: { type: string }
        dialect: { type: string }
        includes_media: { type: boolean }
        warnings:
          type: array
          items: { type: string }

    SiteImportItem:
      type: object
      description: One file's outcome in an import run.
      required: [file, title, slug, kind, action]
      properties:
        file: { type: string }
        title: { type: string }
        slug: { type: string }
        kind: { type: string }
        original_status: { type: string }
        action:
          type: string
          enum: [imported, overwritten, skipped, failed]
        content_id: { type: string }
        status: { type: string }
        reason: { type: string }

    SiteImportReport:
      type: object
      required: [format, format_version, site_id, imported, overwritten, skipped, failed, media_imported, media_reused, items]
      properties:
        format: { type: string, const: practacu-press-site-export }
        format_version: { type: integer }
        site_id: { type: string }
        imported: { type: integer, minimum: 0 }
        overwritten: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        media_imported: { type: integer, minimum: 0 }
        media_reused: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/SiteImportItem' }
        warnings:
          type: array
          items: { type: string }

    EffectiveConfig:
      type: object
      description: |
        Beta 1.2. What the running process is actually using, as opposed to what the
        dashboard has recorded. Secrets are never part of this payload.
      required: [storage, cors, domains, mail, restart_required, captured_at]
      properties:
        storage:
          type: array
          description: |
            One entry per storage scope, already resolved: a scope that inherits the
            global setting reports the inherited driver and root, not an empty value.
          items:
            type: object
            required: [scope, driver]
            properties:
              scope: { type: string, enum: [global, content, site, avatar, attachment] }
              driver: { type: string, enum: [local, s3] }
              local_dir: { type: string, description: Only for driver=local. }
              s3_bucket: { type: string, description: Only for driver=s3. }
              s3_region: { type: string }
              s3_prefix: { type: string }
        cors:
          type: object
          required: [allowed_origins, allow_credentials]
          properties:
            allowed_origins:
              type: array
              items: { type: string }
            allow_credentials: { type: boolean }
        domains:
          type: object
          required: [https_only, public_base_url, trusted_proxies]
          properties:
            https_only: { type: boolean }
            public_base_url: { type: string }
            trusted_proxies:
              type: array
              items: { type: string }
        mail:
          type: object
          required: [configured]
          properties:
            configured: { type: boolean }
            encryption: { type: string }
            from: { type: string, description: Envelope sender only; the password is never returned. }
        restart_required:
          type: boolean
          description: |
            True when the recorded intent differs from what the process loaded, which is
            the cue for the dashboard to say "write the .env and restart the API".
        captured_at: { type: string, format: date-time }

    SystemMetrics:
      type: object
      description: |
        One cached resource sample of the host this installation runs on. The optional
        performance panel polls it every few seconds.
      required: [sampled_at, platform, cpu, memory, disk, app, others]
      properties:
        sampled_at: { type: string, format: date-time }
        platform:
          type: object
          required: [os, arch, hostname, uptime_seconds]
          properties:
            os: { type: string }
            arch: { type: string }
            hostname: { type: string }
            uptime_seconds: { type: integer, minimum: 0 }
        cpu:
          type: object
          required: [usage_percent, cores, model]
          properties:
            usage_percent: { type: number, minimum: 0, maximum: 100 }
            cores: { type: integer, minimum: 1 }
            model: { type: string }
        memory:
          type: object
          required: [total_bytes, used_bytes, free_bytes, usage_percent]
          properties:
            total_bytes: { type: integer, minimum: 0 }
            used_bytes: { type: integer, minimum: 0 }
            free_bytes: { type: integer, minimum: 0 }
            usage_percent: { type: number, minimum: 0, maximum: 100 }
        disk:
          type: object
          required: [path, total_bytes, used_bytes, free_bytes, usage_percent]
          properties:
            path: { type: string }
            total_bytes: { type: integer, minimum: 0 }
            used_bytes: { type: integer, minimum: 0 }
            free_bytes: { type: integer, minimum: 0 }
            usage_percent: { type: number, minimum: 0, maximum: 100 }
        app:
          type: object
          description: Everything attributed to this installation.
          required: [processes, cpu_percent, memory_bytes, storage]
          properties:
            processes:
              type: array
              items: { $ref: '#/components/schemas/SystemProcess' }
            cpu_percent: { type: number, minimum: 0, maximum: 100 }
            memory_bytes: { type: integer, minimum: 0 }
            storage: { $ref: '#/components/schemas/SystemStorage' }
        others:
          type: object
          description: The rest of the machine, aggregated by executable name.
          required: [cpu_percent, memory_bytes, process_count, top_processes]
          properties:
            cpu_percent: { type: number, minimum: 0, maximum: 100 }
            memory_bytes: { type: integer, minimum: 0 }
            process_count: { type: integer, minimum: 0 }
            top_processes:
              type: array
              items: { $ref: '#/components/schemas/SystemAggregateProcess' }

    SystemProcess:
      type: object
      required: [pid, name, role, cpu_percent, memory_bytes]
      properties:
        pid: { type: integer, minimum: 0 }
        name: { type: string }
        role:
          type: string
          description: api, security, launcher, web or app.
        cpu_percent:
          type: number
          description: Share of total system CPU capacity, so rows are comparable with the host figure.
          minimum: 0
          maximum: 100
        memory_bytes: { type: integer, minimum: 0 }

    SystemAggregateProcess:
      type: object
      required: [name, processes, cpu_percent, memory_bytes]
      properties:
        name: { type: string }
        processes: { type: integer, minimum: 0 }
        cpu_percent: { type: number, minimum: 0, maximum: 100 }
        memory_bytes: { type: integer, minimum: 0 }

    SystemStorage:
      type: object
      required: [data_dir, total_bytes, database_bytes, media_bytes, backup_bytes, other_bytes]
      properties:
        data_dir: { type: string }
        total_bytes: { type: integer, minimum: 0 }
        database_bytes: { type: integer, minimum: 0 }
        media_bytes: { type: integer, minimum: 0 }
        backup_bytes: { type: integer, minimum: 0 }
        other_bytes: { type: integer, minimum: 0 }

    Extension:
      type: object
      description: |
        One installed extension package as the management page sees it. `state` is
        the plugin host lifecycle value; `enabled` is the same fact as a boolean.
      required: [id, name, version, description, state, enabled, runtime, permissions, frontend, backend]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        author: { type: string }
        license: { type: string }
        homepage: { type: string }
        state:
          type: string
          enum: [installed, enabled, disabled, failed]
        enabled: { type: boolean }
        runtime:
          type: string
          enum: [none, wasm]
        permissions:
          type: array
          items: { type: string }
        frontend:
          description: The browser half, or null for a backend-only package.
          oneOf:
            - { $ref: '#/components/schemas/ExtensionFrontend' }
            - { type: 'null' }
        backend:
          description: The WASM backend half, or null for a frontend-only package.
          oneOf:
            - { $ref: '#/components/schemas/ExtensionBackend' }
            - { type: 'null' }
        last_error: { type: string }
        installed_at: { type: string, format: date-time }
        enabled_at: { type: string, format: date-time }
        manifest_hash:
          type: string
          description: Beta 1.2. SHA-256 of the manifest the package was installed with.
        integrity:
          type: string
          enum: [verified, unsigned, mismatch]
          description: |
            Beta 1.2. verified means the package still matches the hash recorded at
            install time; unsigned means it predates integrity tracking; mismatch means a
            file changed after install and the package is refused.
        verified_at: { type: string, format: date-time }

    ExtensionFrontend:
      type: object
      required: [entry, styles, slots, blocks]
      properties:
        entry:
          type: string
          description: Absolute /plugins/<id>/<version>/... URL of the browser bundle.
        styles:
          type: array
          description: Bundle-relative stylesheet names the entry directory serves.
          items: { type: string }
        slots:
          type: array
          items: { type: string }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ExtensionBlock' }

    ExtensionBlock:
      type: object
      required: [type]
      properties:
        type: { type: string }
        name: { type: string }

    ExtensionBackend:
      type: object
      required: [wasm, routes, hooks, timeout_ms, max_memory_mb]
      properties:
        wasm: { type: boolean }
        routes:
          type: array
          items: { $ref: '#/components/schemas/ExtensionRoute' }
        hooks:
          type: array
          items: { type: string }
        timeout_ms:
          type: integer
          minimum: 0
          description: Effective per-invocation timeout, using the host default when the manifest omits it.
        max_memory_mb:
          type: integer
          minimum: 0
          description: Effective linear memory cap, using the host default when the manifest omits it.

    ExtensionRoute:
      type: object
      required: [method, path, auth]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        path: { type: string }
        auth:
          type: string
          enum: [public, member, admin]

    # -------------------------------------------------------------------------
    # Beta 1.2 extension schemas.
    # -------------------------------------------------------------------------

    PhonePolicy:
      type: object
      description: Whether the phone sign-in tab should be offered at all.
      required: [enabled, provider, registration_open]
      properties:
        enabled: { type: boolean }
        provider: { type: string, enum: [off, log, http] }
        registration_open: { type: boolean }

    PhoneCodeResult:
      type: object
      required: [expires_at, resend_after_seconds]
      properties:
        expires_at: { type: string, format: date-time }
        resend_after_seconds: { type: integer }
        dev_code:
          type: string
          description: |
            Only present when SMS_DEV_MODE is on. A deployment without an SMS vendor can
            still sign in locally, and the value is never returned in production.

    SiteActivityItem:
      type: object
      required: [id, action, outcome, created_at]
      properties:
        id: { type: string }
        action: { type: string, description: Dotted audit action, for example content.publish. }
        actor_id: { type: string }
        actor_name: { type: string, description: Resolved display name, empty when the account is gone. }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string, enum: [success, failure] }
        detail: { type: string }
        created_at: { type: string, format: date-time }

    DiffHunk:
      type: object
      description: |
        One line level hunk. `from_line` and `to_line` are 1 based positions in the two
        versions; the line that does not exist in one side reports 0.
      required: [op, text]
      properties:
        op: { type: string, enum: [equal, insert, delete] }
        from_line: { type: integer }
        to_line: { type: integer }
        text: { type: string }

    ContentDiff:
      type: object
      required: [from_version, to_version, stats, hunks]
      properties:
        from_version: { type: integer }
        to_version: { type: integer }
        truncated:
          type: boolean
          description: True when the texts were longer than the diff budget and only the head was compared.
        stats:
          type: object
          required: [added, removed]
          properties:
            added: { type: integer }
            removed: { type: integer }
        hunks:
          type: array
          items: { $ref: '#/components/schemas/DiffHunk' }

    BulkActionRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          maxItems: 100
          items: { type: string }
        action:
          type: string
          enum: [submit, publish, archive, unpublish, trash, undelete, purge]

    BulkItemResult:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        error:
          type: string
          description: Stable error code when ok is false; empty otherwise.

    BulkActionResult:
      type: object
      required: [results, succeeded, failed]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BulkItemResult' }
        succeeded: { type: integer }
        failed: { type: integer }

    PreviewGrant:
      type: object
      required: [token, expires_at, path]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        path:
          type: string
          description: Site relative path of the preview, token already attached.

    PathResolution:
      type: object
      required: [kind, status]
      properties:
        kind: { type: string, enum: [content, redirect, missing] }
        status:
          type: integer
          description: HTTP status the page server should answer with (200, 301, 302, 308 or 404).
        canonical_path: { type: string }
        content_id: { type: string }
        slug: { type: string }
        title: { type: string }

    RedirectRule:
      type: object
      required: [id, from_path, to_path, status_code, source, hit_count, created_at, updated_at]
      properties:
        id: { type: string }
        from_path: { type: string }
        to_path: { type: string }
        status_code: { type: integer, enum: [301, 302, 308] }
        source: { type: string, enum: [manual, slug_change, import] }
        hit_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RedirectRuleInput:
      type: object
      required: [from_path, to_path]
      properties:
        from_path: { type: string, maxLength: 512 }
        to_path: { type: string, maxLength: 512 }
        status_code: { type: integer, enum: [301, 302, 308], default: 301 }

    SystemLogEntry:
      type: object
      description: |
        Request metadata only. Bodies, headers, cookies and query strings are never
        recorded, which is what makes the panel safe to show to a site administrator.
      required: [time, request_id, method, path, status, duration_ms]
      properties:
        time: { type: string, format: date-time }
        request_id: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        duration_ms: { type: integer }
        site_id: { type: string }
        user_id: { type: string }

    QueueEvent:
      type: object
      required: [event_id, event_type, status, attempts, occurred_at]
      properties:
        event_id: { type: string }
        event_type: { type: string }
        status: { type: string, enum: [pending, published, failed] }
        attempts: { type: integer }
        last_error: { type: string }
        occurred_at: { type: string, format: date-time }

    QueueStatus:
      type: object
      required: [outbox, recent, mail]
      properties:
        outbox:
          type: object
          required: [pending, failed, oldest_age_seconds]
          properties:
            pending: { type: integer }
            failed: { type: integer }
            oldest_age_seconds: { type: integer }
        recent:
          type: array
          items: { $ref: '#/components/schemas/QueueEvent' }
        mail:
          type: object
          required: [queued, failed]
          properties:
            queued: { type: integer }
            failed: { type: integer }

    BackupScheduleArtifact:
      type: object
      required: [name, size, created_at]
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    BackupSchedule:
      type: object
      description: |
        The schedule the process is actually running with. It comes from the
        environment, so the dashboard shows it read only.
      required: [enabled, hour, keep, artifacts]
      properties:
        enabled: { type: boolean }
        hour: { type: integer, minimum: 0, maximum: 23 }
        keep: { type: integer }
        last_run_at: { type: string, format: date-time }
        last_status: { type: string, enum: ['', ok, failed] }
        last_error: { type: string }
        next_run_at: { type: string, format: date-time }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/BackupScheduleArtifact' }

    NewsletterSubscribeResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed]
          description: |
            pending means a confirmation mail was queued; confirmed means the address was
            already subscribed and nothing was sent.

    MyNewsletterPreference:
      type: object
      required: [subscribed]
      properties:
        subscribed: { type: boolean }
        email: { type: string }
        status: { type: string, enum: [pending, confirmed, unsubscribed, bounced, ''] }

    Subscriber:
      type: object
      required: [id, email, status, source, created_at]
      properties:
        id: { type: string }
        email: { type: string }
        status: { type: string, enum: [pending, confirmed, unsubscribed, bounced] }
        source: { type: string }
        user_id: { type: string }
        confirmed_at: { type: string, format: date-time }
        unsubscribed_at: { type: string, format: date-time }
        last_sent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    NewsletterStats:
      type: object
      required: [confirmed, pending, unsubscribed, sent_7d, failed_7d]
      properties:
        confirmed: { type: integer }
        pending: { type: integer }
        unsubscribed: { type: integer }
        sent_7d: { type: integer }
        failed_7d: { type: integer }

    EmailTemplate:
      type: object
      required: [key, name, subject, body_html, body_text, enabled, builtin]
      properties:
        key: { type: string }
        name: { type: string }
        subject: { type: string }
        body_html: { type: string }
        body_text: { type: string }
        enabled: { type: boolean }
        builtin:
          type: boolean
          description: True when no override exists and the shipped default is being shown.
        updated_at: { type: string, format: date-time }

    EmailTemplateInput:
      type: object
      required: [subject, body_html, body_text]
      properties:
        name: { type: string, maxLength: 120 }
        subject: { type: string, maxLength: 300 }
        body_html: { type: string }
        body_text: { type: string }
        enabled: { type: boolean, default: true }

    EmailLog:
      type: object
      required: [id, to_email, kind, subject, status, created_at]
      properties:
        id: { type: string }
        to_email: { type: string }
        kind: { type: string, enum: [system, newsletter] }
        template_key: { type: string }
        subject: { type: string }
        status: { type: string, enum: [queued, sent, failed, skipped] }
        error: { type: string }
        sent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

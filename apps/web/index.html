<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Practacu Press — 支持多站点、审核流程与社区互动的独立出版 CMS。"
      data-pp-seo="1"
    />
    <!--
      以下分享标签是「不执行 JS 的抓取器」看到的默认值。
      data-pp-seo 让运行时（lib/seo.ts）在首屏把它们整体替换成当前页面的真实值，
      不会留下两份 og:title。
    -->
    <meta property="og:site_name" content="Practacu Press" data-pp-seo="1" />
    <meta property="og:type" content="website" data-pp-seo="1" />
    <meta property="og:title" content="Practacu Press" data-pp-seo="1" />
    <meta
      property="og:description"
      content="支持多站点、审核流程与社区互动的独立出版 CMS。"
      data-pp-seo="1"
    />
    <meta property="og:locale" content="zh_CN" data-pp-seo="1" />
    <meta name="twitter:card" content="summary" data-pp-seo="1" />
    <title>Practacu Press</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2313130f'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23ffffff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

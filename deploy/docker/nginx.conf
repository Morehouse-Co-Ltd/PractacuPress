# 静态站 + 同源反向代理。
# 浏览器只跟 Nginx 说话：/api、/healthz、/readyz、/sitemap.xml、/robots.txt
# 转到 Go API，因此前端没有跨域配置，Cookie 与 WebSocket 天然同源。
#
# 安全响应头与启动器一致（apps/launcher/main.go 的 contentSecurityPolicy）：
# 这层是纵深防御，TLS/HSTS 交给外层反代（deploy/production/nginx.conf）。

# 不在响应头与错误页里暴露 Nginx 版本号。
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# When this image sits behind another proxy (deploy/production/nginx.conf), keep the
# public scheme and host it saw. A direct request has no forwarded headers, so the
# local $scheme/$http_host is used; that host still includes a mapped port such as
# :8080, which is what the crawler files need for absolute URLs.
map $http_x_forwarded_proto $pp_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $pp_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

# 压缩只作用于文本资源；图片本身已压缩。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与 API 的单文件上限（25 MiB）留出表单开销。
    client_max_body_size 30m;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://*.hcaptcha.com https://www.gstatic.com; script-src 'self' https://challenges.cloudflare.com https://js.hcaptcha.com https://www.google.com https://www.gstatic.com; frame-src https://challenges.cloudflare.com https://*.hcaptcha.com https://www.google.com https://recaptcha.google.com; connect-src 'self' https://challenges.cloudflare.com https://*.hcaptcha.com https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 启动器控制面绝不对外：docker 形态不跑启动器，但模板要防止以后被复制到
    # 「启动器 + 同机反代」的部署里（V-04：反代不能转发 /__pp/*）。
    location = /__pp { return 404; }
    location /__pp/ { return 404; }

    # 服务端渲染的 HTML 不进缓存，避免发版后拿到旧壳。
    # 注意：location 里一旦出现 add_header，就不再继承 server 级安全头，
    # 所以这里用 expires（不参与 add_header 继承）而不是 add_header。
    location = /index.html {
        expires -1;
    }

    # 带内容哈希的构建产物可以长期缓存。这里必须自带 add_header，因此重复
    # 一次安全头（Nginx 的 add_header 不跨层继承）。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://*.hcaptcha.com https://www.gstatic.com; script-src 'self' https://challenges.cloudflare.com https://js.hcaptcha.com https://www.google.com https://www.gstatic.com; frame-src https://challenges.cloudflare.com https://*.hcaptcha.com https://www.google.com https://recaptcha.google.com; connect-src 'self' https://challenges.cloudflare.com https://*.hcaptcha.com https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # 爬虫文件由 API 按请求 Host 解析站点后生成。这里必须是精确匹配：
    # 否则它们会落到下面的 SPA 兜底，把 index.html 当成 sitemap 返回。
    location = /sitemap.xml {
        proxy_pass http://api:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $pp_forwarded_host;
        proxy_set_header X-Forwarded-Proto $pp_forwarded_proto;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://api:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $pp_forwarded_host;
        proxy_set_header X-Forwarded-Proto $pp_forwarded_proto;
        access_log off;
    }

    # 扩展前端 bundle / CSS 由 API 提供（/plugins/<id>/<version>/...）。CSP 的
    # script-src 'self' 允许同源脚本，所以这里必须代理，不能落到 SPA 兜底。
    location /plugins/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # /api/v1/ws 走 WebSocket 升级；其余请求 Connection 为 close。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 媒体下载与 WebSocket 是长连接，读超时需要放宽。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 单页应用：静态文件优先，其余交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

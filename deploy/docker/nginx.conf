# 静态站 + 同源反向代理。
# 浏览器只跟 Nginx 说话：/api、/healthz、/readyz 转到 Go API，
# 因此前端没有跨域配置，Cookie 与 WebSocket 天然同源。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 压缩只作用于文本资源；图片本身已压缩。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与 API 的单文件上限（25 MiB）留出表单开销。
    client_max_body_size 30m;

    # 服务端渲染的 HTML 不进缓存，避免发版后拿到旧壳。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带内容哈希的构建产物可以长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/v1/ws 走 WebSocket 升级；其余请求 Connection 为 close。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 媒体下载与 WebSocket 是长连接，读超时需要放宽。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 单页应用：静态文件优先，其余交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

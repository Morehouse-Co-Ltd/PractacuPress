# Static site + same-origin reverse proxy for the container image.
#
# The browser only talks to Nginx: /api, /healthz, /readyz, the crawler files, the
# feeds and extension bundles go to the Go API, so the frontend needs no CORS
# configuration and cookies/WebSocket are same-origin by construction.
#
# Security response headers are a defence-in-depth copy of the ones the API and the
# Windows launcher set. HSTS belongs to the outer TLS proxy
# (deploy/production/nginx.conf).

server_tokens off;

# Docker's embedded DNS. Used by the `resolve` parameter on the upstream below so
# a recreated API container is picked up without restarting this container.
resolver 127.0.0.11 valid=10s ipv6=off;

# Re-resolve the API address while keeping upstream keep-alive.
upstream practacu_api {
    zone practacu_api 64k;
    server api:8080 resolve;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Preserve the public scheme/host when this image sits behind another proxy
# (deploy/production/nginx.conf). A direct request has no forwarded headers, so
# the local $scheme/$http_host is used.
map $http_x_forwarded_proto $pp_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $pp_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

# $http_host includes a mapped port (localhost:8080); $host would drop it.
map $http_host $pp_host {
    default $http_host;
    ''      $host;
}

# Compress text responses only; images and fonts are already compressed.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ordinary JSON ceiling. Bulk transfer routes raise it individually below.
    client_max_body_size 30m;

    # frame-src must include 'self': the page builder previews the real front end
    # in a same-origin iframe, and omitting it shows the browser's "blocked" page
    # instead of the site. frame-ancestors is what stops other sites embedding us.
    # Keep this string byte-identical to deploy/production/nginx.conf; the deploy
    # header test compares every copy.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://*.hcaptcha.com https://www.gstatic.com; script-src 'self' https://challenges.cloudflare.com https://js.hcaptcha.com https://www.google.com https://www.gstatic.com; frame-src 'self' https: http:; connect-src 'self' https://challenges.cloudflare.com https://*.hcaptcha.com https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The launcher control plane never exists in this image. The explicit 404 also
    # protects a deployment that later puts a launcher behind the same proxy
    # (V-04: a reverse proxy must not forward /__pp/*).
    location = /__pp { return 404; }
    location /__pp/ { return 404; }

    # Server-rendered HTML must not be cached, or an upgrade serves the old shell.
    # `expires` does not reset add_header inheritance the way a location-level
    # add_header would, so the security headers above are still sent.
    location = /index.html { expires -1; }
    location = /version.json { expires -1; }
    # The dark-mode bootstrap is an unhashed file at the document root; it must not
    # be cached past the shell it belongs to.
    location = /theme-boot.js { expires -1; }

    # Content-hashed build output is safe to cache for a year. No add_header here:
    # adding one would drop every server-level security header on these responses,
    # and `expires` already emits Cache-Control with the max-age.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /healthz {
        include /etc/nginx/proxy-params.inc;
        access_log off;
    }

    location = /readyz {
        include /etc/nginx/proxy-params.inc;
        access_log off;
    }

    location = /api {
        include /etc/nginx/proxy-params.inc;
    }

    # Crawler files and feeds are generated per request-host by the Go API. They
    # must be exact/regex matches, otherwise they fall through to the SPA fallback
    # and the index page is served as a sitemap or an RSS feed.
    location = /sitemap.xml {
        include /etc/nginx/proxy-params.inc;
        access_log off;
    }

    location = /robots.txt {
        include /etc/nginx/proxy-params.inc;
        access_log off;
    }

    location = /rss.xml {
        include /etc/nginx/proxy-params.inc;
        access_log off;
    }

    location = /atom.xml {
        include /etc/nginx/proxy-params.inc;
        access_log off;
    }

    location = /feed.xml {
        include /etc/nginx/proxy-params.inc;
        access_log off;
    }

    location ~ ^/(category|tag)/[^/]+/(rss|atom)\.xml$ {
        include /etc/nginx/proxy-params.inc;
        access_log off;
    }

    # Extension browser bundles and styles are same-origin scripts served by the
    # API. They must not fall through to the SPA.
    location /plugins/ {
        include /etc/nginx/proxy-params.inc;
    }

    # Bulk package routes: whole-instance backups and site export/import. The API
    # accepts up to 512 MiB for an import, so the ordinary 30m ceiling would turn a
    # valid package into a 413. Request buffering is off so the API's own limit
    # rejects an oversized body without Nginx spooling all of it to disk first.
    location ~ ^/api/v1/(platform/backups|sites/[^/]+/(export|import))(/|$) {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/proxy-params.inc;
    }

    # Media downloads are long lived and already compressed: do not buffer them and
    # allow a slow reader more than the default five minutes.
    location ~ ^/api/v1/media/ {
        proxy_buffering off;
        proxy_read_timeout 1800s;
        include /etc/nginx/proxy-params.inc;
    }

    location /api/ {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        include /etc/nginx/proxy-params.inc;
    }

    # Single page application: real files first, then the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

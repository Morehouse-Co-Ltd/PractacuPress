# Practacu Press —— 宿主机 Nginx：TLS 终止 + 安全响应头 + 反代模板
#
# 适用形态：docker compose（API 只绑 127.0.0.1:8080，已内嵌前端）或任何把站点放在
# 127.0.0.1:8080 的同机部署。生产环境变量模板见 deploy/production/env.prod.example。
#
#   1. 把这段配置放进宿主机 Nginx（例如 /etc/nginx/conf.d/practacu-press.conf），
#      修改 server_name / 证书路径；
#   2. nginx -t 通过后 systemctl reload nginx；
#   3. 由 certbot 申请证书（HTTP-01 挑战路径已保留）。
#
# 重要：不要把 /__pp/* 这类控制面路径反代到公网。Go API 对 /__pp 一律返回 404，
# 下方显式 404 是反代层的第二道防线：即使以后前面再接静态服务器，端口修改接口也
# 不会被远程触达（V-04）。

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP：只保留 ACME 挑战，其余跳 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name press.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx ≥ 1.25.1 使用 http2 on；更老的版本改成 listen 443 ssl http2;
    http2 on;
    server_name press.example.com;

    # certbot 默认路径；换成自己的证书时同步修改。
    ssl_certificate     /etc/letsencrypt/live/press.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/press.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 确认全站 HTTPS 稳定后再考虑追加 preload。HSTS 一旦下发，浏览器会记住，
    # 回退到 HTTP 会导致站点无法打开，所以先从一年、不含 preload 开始。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 与 internal/transport/http/gin/middleware/security_headers.go 的
    # ContentSecurityPolicy 保持一致：页面来自本域，
    # 内联 style 留给主题层，内联 script 不允许。反代层再保留一份是纵深防御。
    # frame-src 必须包含 'self'：页面编排用同源 iframe 预览真实前台，缺了它编辑器
    # 只会显示浏览器的「此内容已被屏蔽」。frame-ancestors 才是防别的站嵌本站的开关。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://*.hcaptcha.com https://www.gstatic.com; script-src 'self' https://challenges.cloudflare.com https://js.hcaptcha.com https://www.google.com https://www.gstatic.com; frame-src 'self' https: http:; connect-src 'self' https://challenges.cloudflare.com https://*.hcaptcha.com https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 容器内 Nginx / Go API 已经设置过同名头；这里先丢弃上游值，避免重复下发。
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Content-Type-Options;

    # 启动器控制面与安装目录文件绝不对外。
    location = /__pp { return 404; }
    location /__pp/ { return 404; }
    location ~* ^/(data|practacu-web\.json|\.git)(/|$) { return 404; }

    client_max_body_size 30m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 覆盖而非追加：客户端自己塞的 X-Forwarded-For 在这里被丢掉。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # /api/v1/ws 走 WebSocket 升级；其余请求 Connection 为 close。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 媒体下载与 WebSocket 是长连接，读超时放宽；升级期间不要缓冲。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 静态资源的 Cache-Control/ETag 由容器内 Nginx 与 Go 决定，原样透传。
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
    }
}

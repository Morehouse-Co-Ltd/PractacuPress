name: practacu-press
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
release: ${NFPM_RELEASE}
section: web
priority: optional
maintainer: Practacu Press <maintainers@practacu.press>
description: |-
  Self-hosted multi-site publishing platform.
  Ships the Go API with in-process security checks and the prebuilt frontend, plus
  the systemd and Nginx templates used by the installer.
vendor: Practacu Press
homepage: https://github.com/practacu/practacu-press
license: AGPL-3.0-only

depends:
  - ca-certificates
  - curl
  - openssl
  - nginx

contents:
  # The installer copies this tree into /opt/practacu-press, so the source and
  # destination must stay different (install.sh removes the destination bin/
  # directory before copying).
  - src: ${NFPM_STAGE}
    dst: /usr/lib/practacu-press
    type: tree
    expand: true

scripts:
  postinstall: deploy/package/linux/postinstall.sh
  preremove: deploy/package/linux/preremove.sh
